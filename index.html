<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>قاموس الصينية — كلمات وجمل</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232d6cdf'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='white'%3E字%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== base.css ===== */
/* ============================================================
   base.css — design tokens + shared components.
   Module CSS must use its own prefix (.pr- print, .qz- quiz, .bk- bulk, .ui- main UI)
   and rely only on the tokens/classes defined here.
   ============================================================ */
:root {
  --bg: #f3f4f8; --card: #fff; --sf: #f8f9fc; --hov: #eef0f6;
  --acc: #d63031; --accl: #fff1f0; --bl: #2d6cdf; --bll: #e8f0fe; --gn: #1f9d57; --gnl: #e3f5ea; --yl: #fef3c7; --or: #e08a1e; --orl: #fdf1df; --pu: #6d4ad8; --pul: #efeafd;
  --tx: #1a1d26; --dm: #6b7280; --ft: #9ca3af; --bd: #e2e5ed; --bdl: #eff1f5;
  --sh: 0 1px 3px rgba(0, 0, 0, .07); --shl: 0 12px 32px rgba(0, 0, 0, .16);
  --r: 8px; --rl: 14px;
  --fa: 'Tajawal', 'Segoe UI', Tahoma, 'Noto Naskh Arabic', Arial, sans-serif;
  --fz: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  --fe: 'Noto Sans', 'Segoe UI', Arial, sans-serif;
  --fm: 'IBM Plex Mono', Consolas, monospace;
  /* base text sizes in px; multiplied by the user's font factors */
  --b-zh: 22px; --b-pin: 14px; --b-ar: 16px; --b-en: 14px;
  --f-all: 1; --f-zh: 1; --f-pin: 1; --f-ar: 1; --f-en: 1;
}
:root[data-theme="dark"] {
  --bg: #12141a; --card: #1b1e27; --sf: #20242f; --hov: #272c39; --tx: #e8eaf0; --dm: #9aa3b5; --ft: #6c7487; --bd: #2d3342; --bdl: #252a37;
  --bll: #1c2a46; --gnl: #14301f; --accl: #3a1a1a; --orl: #3a2a12; --pul: #2a2247; --yl: #3a3414;
  --sh: 0 1px 3px rgba(0, 0, 0, .5); --shl: 0 12px 32px rgba(0, 0, 0, .6);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--fa); background: var(--bg); color: var(--tx); font-size: 15px; line-height: 1.5; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
html.md-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #c4c9d6; border-radius: 8px; }
[hidden] { display: none !important; }

/* language text classes (font factors applied) */
/* Chinese/pinyin are LTR text inside an RTL page: keep them LTR (so trailing punctuation stays on the right side of the text) but right-aligned. */
.t-zh { font-family: var(--fz); font-size: calc(var(--b-zh) * var(--f-all) * var(--f-zh)); line-height: 1.35; direction: ltr; text-align: right; }
.t-pin { font-family: var(--fe); font-size: calc(var(--b-pin) * var(--f-all) * var(--f-pin)); color: var(--bl); direction: ltr; text-align: right; }
.t-ar { font-family: var(--fa); font-size: calc(var(--b-ar) * var(--f-all) * var(--f-ar)); direction: rtl; }
.t-en { font-family: var(--fe); font-size: calc(var(--b-en) * var(--f-all) * var(--f-en)); direction: ltr; unicode-bidi: plaintext; color: var(--dm); }

/* icons (inline SVG): one colour per meaning, so actions are recognisable at a glance */
.ic { width: 1.25em; height: 1.25em; vertical-align: -.25em; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico { display: inline-flex; align-items: center; }
.ic-add { color: #2d6cdf; } .ic-bulk { color: #0ea5e9; } .ic-print { color: #0284c7; } .ic-quiz { color: #db2777; } .ic-stats { color: #7c3aed; }
.ic-settings { color: #475569; } .ic-data { color: #0f766e; } .ic-edit { color: #2563eb; } .ic-dup { color: #7c3aed; } .ic-del { color: #dc2626; }
.ic-speak { color: #16a34a; } .ic-hide { color: #d97706; } .ic-show { color: #0891b2; } .ic-up, .ic-down { color: #64748b; } .ic-cloud { color: #0ea5e9; }
.ic-layers { color: #6d4ad8; } .ic-link { color: #2563eb; } .ic-search { color: #64748b; } .ic-repeat { color: #7c3aed; } .ic-folder { color: #ca8a04; }
.ic-file { color: #16a34a; } .ic-download { color: #0f766e; } .ic-upload { color: #0369a1; } .ic-refresh { color: #2563eb; } .ic-check { color: #16a34a; } .ic-clean { color: #475569; } .ic-warn { color: #d97706; } .ic-lock { color: #d97706; } .ic-x { color: #64748b; }
.btn.pri .ic, .btn.dng .ic, .btn.gn .ic, .chip.on .ic, .seg button.on .ic, .ui-selbar .ic { color: #fff; }
:root[data-theme="dark"] .ic { filter: brightness(1.35); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 6px 14px; border: 1px solid var(--bd); background: var(--card); border-radius: var(--r); cursor: pointer; font-weight: 500; font-size: 13.5px; transition: .12s; white-space: nowrap; }
.btn:hover { background: var(--hov); } .btn:active { transform: translateY(1px); }
.btn.pri { background: var(--bl); border-color: var(--bl); color: #fff; } .btn.pri:hover { filter: brightness(1.08); }
.btn.dng { background: var(--acc); border-color: var(--acc); color: #fff; } .btn.dng:hover { filter: brightness(1.08); }
.btn.gn { background: var(--gn); border-color: var(--gn); color: #fff; }
.btn.ghost { background: transparent; } .btn.sm { min-height: 30px; padding: 3px 10px; font-size: 12.5px; }
.btn.ico { min-width: 34px; padding: 4px 8px; } .btn[disabled] { opacity: .45; pointer-events: none; }

/* forms */
.fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; min-width: 0; }
.fld > label, .lbl { font-size: 12.5px; color: var(--dm); font-weight: 500; }
.inp, .sel, .txa { width: 100%; padding: 7px 10px; min-height: 36px; border: 1px solid var(--bd); border-radius: var(--r); background: var(--card); outline: 0; transition: .12s; }
.inp:focus, .sel:focus, .txa:focus { border-color: var(--bl); box-shadow: 0 0 0 3px rgba(45, 108, 223, .15); }
.txa { resize: vertical; min-height: 64px; }
.inp.zh, .txa.zh { font-family: var(--fz); font-size: 18px; direction: ltr; text-align: left; } .inp.en, .txa.en { direction: ltr; text-align: left; font-family: var(--fe); } .inp.pin, .txa.pin { direction: ltr; text-align: left; font-family: var(--fe); }
.row { display: flex; gap: 10px; flex-wrap: wrap; } .row > * { flex: 1 1 160px; min-width: 0; } .row.nogrow > * { flex: 0 0 auto; }
.hint { font-size: 12px; color: var(--dm); } .err-t { color: var(--acc); }
.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: 13.5px; } .chk input { width: 17px; height: 17px; accent-color: var(--bl); }

/* segmented control */
.seg { display: inline-flex; border: 1px solid var(--bd); border-radius: var(--r); overflow: hidden; background: var(--card); }
.seg button { border: 0; border-inline-start: 1px solid var(--bd); background: transparent; padding: 6px 12px; cursor: pointer; font-size: 13px; min-height: 34px; }
.seg button:first-child { border-inline-start: 0; } .seg button.on { background: var(--bl); color: #fff; }

/* chips / tags */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--bd); background: var(--card); cursor: pointer; font-size: 13px; user-select: none; transition: .12s; }
.chip:hover { background: var(--hov); } .chip.on { background: var(--bl); border-color: var(--bl); color: #fff; }
.chip .n { font-size: 11px; opacity: .75; font-family: var(--fm); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; background: var(--hov); color: var(--dm); }
.tag.warn { background: var(--yl); color: #92400e; } .tag.ok { background: var(--gnl); color: var(--gn); } .tag.bad { background: var(--accl); color: var(--acc); }

/* panels */
.panel { background: var(--card); border: 1px solid var(--bd); border-radius: var(--rl); padding: 12px 14px; box-shadow: var(--sh); }
.panel + .panel { margin-top: 10px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; } .tbl th, .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--bdl); text-align: start; vertical-align: top; } .tbl th { background: var(--sf); color: var(--dm); font-weight: 600; position: sticky; top: 0; }
.scroll-y { overflow: auto; max-height: 55vh; }

/* modal */
.md-back { position: fixed; inset: 0; background: rgba(15, 18, 28, .55); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px; animation: mdfade .15s; backdrop-filter: blur(2px); }
.md-box { background: var(--card); border-radius: var(--rl); width: 100%; max-width: 760px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: var(--shl); overflow: hidden; animation: mdup .18s; }
.md-box.md-sm { max-width: 420px; } .md-box.md-lg { max-width: 1000px; } .md-box.md-full { max-width: 1200px; height: calc(100vh - 32px); }
.md-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--bd); }
.md-title { font-weight: 700; font-size: 16px; } .md-x { border: 0; background: transparent; font-size: 26px; line-height: 1; cursor: pointer; color: var(--dm); padding: 0 6px; } .md-x:hover { color: var(--acc); }
.md-body { padding: 14px 16px; overflow: auto; flex: 1 1 auto; } .md-foot { display: flex; gap: 8px; justify-content: flex-start; flex-wrap: wrap; padding: 10px 16px; border-top: 1px solid var(--bd); background: var(--sf); }
.md-msg { line-height: 1.7; margin-bottom: 8px; }
@keyframes mdfade { from { opacity: 0; } to { opacity: 1; } } @keyframes mdup { from { transform: translateY(14px); opacity: .5; } to { transform: none; opacity: 1; } }
@media (max-width: 640px) { .md-back { padding: 0; align-items: flex-end; } .md-box { max-width: none !important; border-radius: var(--rl) var(--rl) 0 0; max-height: 94vh; } .md-box.md-full { height: 94vh; } }

/* toast */
.toast { position: fixed; bottom: 18px; left: 50%; transform: translate(-50%, 80px); background: var(--tx); color: var(--bg); padding: 8px 20px; border-radius: var(--r); font-size: 13px; z-index: 900; box-shadow: var(--shl); transition: transform .25s; pointer-events: none; max-width: 90vw; }
.toast.show { transform: translate(-50%, 0); } .toast.err { background: var(--acc); color: #fff; } .toast.ok { background: var(--gn); color: #fff; }

@media print { .toast, .md-back { display: none !important; } }

/* ===== ui.css ===== */
/* ============================================================
   ui.css — main screen (prefix .ui-)
   ============================================================ */
#app { max-width: 1280px; margin: 0 auto; padding: 0 12px 90px; }

/* ---- top bar ---- */
.ui-top { position: sticky; top: 0; z-index: 40; background: var(--bg); padding: 10px 0 8px; }
.ui-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ui-brand { font-weight: 800; font-size: 19px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.ui-brand .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--bl), var(--pu) 60%, var(--or)); color: #fff; display: grid; place-items: center; font-family: var(--fz); font-size: 19px; box-shadow: var(--sh); }
.ui-search { position: relative; flex: 1 1 260px; min-width: 180px; }
.ui-search .inp { padding-inline-end: 34px; border-radius: 999px; min-height: 40px; }
.ui-search button { position: absolute; inset-inline-end: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; cursor: pointer; font-size: 18px; color: var(--dm); width: 28px; height: 28px; border-radius: 50%; }
.ui-search button:hover { background: var(--hov); }
.ui-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.ui-actions .btn { min-height: 40px; }
.ui-groups { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 4px; scrollbar-width: none; }
.ui-groups::-webkit-scrollbar { display: none; }
.ui-gchip { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 12px; border: 1.5px solid var(--bd); background: var(--card); cursor: pointer; font-weight: 600; font-size: 14px; transition: .12s; }
.ui-gchip i { width: 10px; height: 10px; border-radius: 50%; background: var(--gc, var(--dm)); display: inline-block; }
.ui-gchip .n { font-size: 11px; font-family: var(--fm); color: var(--dm); font-weight: 500; }
.ui-gchip:hover { border-color: var(--gc, var(--bl)); }
.ui-gchip.on { background: var(--gc, var(--bl)); border-color: var(--gc, var(--bl)); color: #fff; box-shadow: var(--sh); }
.ui-gchip.on i { background: #fff; } .ui-gchip.on .n { color: rgba(255, 255, 255, .85); }
.ui-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 6px 0 2px; }
.ui-filters .sel { width: auto; min-width: 150px; max-width: 240px; flex: 1 1 150px; }
.ui-sp { flex: 1 1 10px; }
.ui-lang { display: inline-flex; gap: 4px; }
.ui-lang button { border: 1.5px solid var(--bd); background: var(--card); border-radius: 8px; padding: 3px 9px; min-height: 34px; cursor: pointer; font-size: 13px; transition: .1s; }
.ui-lang button.on { background: var(--bll); border-color: var(--bl); color: var(--bl); font-weight: 700; }
.ui-lang button.off { opacity: .55; text-decoration: line-through; }
.ui-info { font-size: 12.5px; color: var(--dm); padding: 2px 2px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ui-banner { background: var(--yl); border: 1px solid #f1d98b; color: #78350f; padding: 8px 12px; border-radius: var(--r); margin: 6px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }

/* ---- selection bar ---- */
.ui-selbar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--tx); color: var(--bg); padding: 8px 12px; border-radius: 14px; display: flex; gap: 6px; align-items: center; box-shadow: var(--shl); flex-wrap: wrap; justify-content: center; max-width: 96vw; }
.ui-selbar .btn { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .25); color: inherit; min-height: 32px; font-size: 13px; }
.ui-selbar .btn:hover { background: rgba(255, 255, 255, .24); } .ui-selbar .btn.dng { background: var(--acc); }
.ui-selbar b { padding: 0 6px; }

/* ---- list ---- */
.ui-list { margin-top: 6px; }
.ui-h1 { margin: 16px 0 6px; padding: 9px 14px; border-radius: 12px; background: var(--gc); color: #fff; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; box-shadow: var(--sh); }
.ui-h1 .sep { opacity: .6; } .ui-h1 .n { margin-inline-start: auto; font-family: var(--fm); font-size: 12px; background: rgba(255, 255, 255, .22); padding: 1px 9px; border-radius: 999px; }
.ui-h1 a { color: #fff; text-decoration: none; background: rgba(255, 255, 255, .22); border-radius: 999px; padding: 0 9px; font-size: 12px; }
.ui-h1 .tag { background: rgba(255, 255, 255, .22); color: #fff; }
.ui-h2 { margin: 10px 0 4px; padding: 4px 12px; font-weight: 700; color: var(--gc); border-inline-start: 4px solid var(--gc); display: flex; gap: 8px; align-items: center; font-size: 14.5px; background: var(--gs); border-radius: 0 8px 8px 0; }
.ui-h2 .n { font-family: var(--fm); font-size: 11.5px; color: var(--dm); font-weight: 500; }
.ui-h2 .btn { margin-inline-start: auto; min-height: 26px; padding: 0 8px; font-size: 12px; }

.ui-it { display: flex; align-items: flex-start; gap: 8px; background: var(--card); border: 1px solid var(--bd); border-inline-start: 4px solid var(--gc, var(--bd)); border-radius: 10px; padding: 8px 10px; margin-bottom: 5px; transition: box-shadow .12s, background .12s; }
.ui-it:hover { box-shadow: var(--sh); background: color-mix(in srgb, var(--gs, #fff) 40%, var(--card)); }
.ui-it.sel { background: var(--bll); border-color: var(--bl); }
.ui-no { flex: none; font-family: var(--fm); font-size: 11px; color: var(--ft); min-width: 22px; text-align: center; padding-top: 6px; }
.ui-sel { flex: none; padding-top: 4px; } .ui-sel input { width: 18px; height: 18px; accent-color: var(--bl); cursor: pointer; }
.ui-cells { flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: var(--cols, 1fr); gap: 2px 16px; align-items: baseline; }
.ui-cells > div { min-width: 0; overflow-wrap: anywhere; }
.ui-meta { flex: none; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; min-width: 54px; }
.ui-acts { flex: none; display: flex; gap: 2px; opacity: .55; transition: opacity .12s; }
.ui-it:hover .ui-acts, .ui-cd:hover .ui-acts, .ui-acts:focus-within { opacity: 1; }
.ui-acts button { border: 0; background: transparent; cursor: pointer; width: 30px; height: 30px; border-radius: 8px; font-size: 15px; line-height: 1; }
.ui-acts button:hover { background: var(--hov); } .ui-acts button.d:hover { background: var(--accl); }
.ui-sc { font-family: var(--fm); font-size: 11px; border-radius: 999px; padding: 0 7px; background: var(--hov); color: var(--dm); }
.ui-sc.neg { background: var(--accl); color: var(--acc); } .ui-sc.mid { background: var(--yl); color: #92400e; } .ui-sc.pos { background: var(--gnl); color: var(--gn); }

.ui-list.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; align-items: start; }
.ui-list.cards > .ui-h1, .ui-list.cards > .ui-h2, .ui-list.cards > .ui-empty { grid-column: 1 / -1; }
.ui-list.cards > .ui-h1 { margin-bottom: 0; }
.ui-cd { background: var(--card); border: 1px solid var(--bd); border-top: 4px solid var(--gc, var(--bd)); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; box-shadow: var(--sh); transition: transform .12s; position: relative; }
.ui-cd:hover { transform: translateY(-2px); } .ui-cd.sel { background: var(--bll); outline: 2px solid var(--bl); }
.ui-cd-top { display: flex; align-items: center; gap: 6px; min-height: 26px; } .ui-cd-top .ui-no { padding: 0; }
.ui-cd .t-zh { text-align: center; padding: 4px 0 0; } .ui-cd .t-pin { text-align: center; } .ui-cd .t-ar { text-align: center; border-top: 1px dashed var(--bdl); padding-top: 5px; margin-top: 3px; } .ui-cd .t-en { text-align: center; }
.ui-cd .ui-acts { justify-content: center; margin-top: 4px; }
.ui-empty { text-align: center; padding: 60px 10px; color: var(--dm); }
.ui-empty .big { font-size: 42px; } .ui-empty .big .ic { width: 1.1em; height: 1.1em; color: var(--ft); }
.ui-more { text-align: center; padding: 14px; color: var(--dm); font-size: 13px; }

/* ---- dialogs ---- */
.ui-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } @media (max-width: 640px) { .ui-two { grid-template-columns: 1fr; } }
.ui-dupnote { font-size: 12px; color: #92400e; background: var(--yl); border-radius: 6px; padding: 3px 8px; margin-top: 3px; }
.ui-cls-c1 { border: 1px solid var(--bd); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.ui-cls-c1 > .hd { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--gs); border-inline-start: 4px solid var(--gc); font-weight: 700; flex-wrap: wrap; }
.ui-cls-c2 { display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 10px; border-top: 1px solid var(--bdl); font-size: 14px; }
.ui-cls-c2 .nm, .ui-cls-c1 .nm { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.ui-cls-c2 .n, .ui-cls-c1 .n { font-family: var(--fm); font-size: 11.5px; color: var(--dm); }
.ui-slid { display: grid; grid-template-columns: 90px 1fr 54px; gap: 10px; align-items: center; margin-bottom: 8px; } .ui-slid input[type=range] { width: 100%; accent-color: var(--bl); }
.ui-slid output { font-family: var(--fm); font-size: 12.5px; text-align: center; }
.ui-sample { border: 1px dashed var(--bd); border-radius: 10px; padding: 10px; display: grid; gap: 2px; background: var(--sf); }
.ui-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin-bottom: 8px; } .ui-kv dt { color: var(--dm); } .ui-kv dd { margin: 0; }
.ui-menu { display: grid; gap: 8px; } .ui-menu .btn { justify-content: flex-start; min-height: 42px; width: 100%; }
.ui-pop { position: absolute; z-index: 80; background: var(--card); border: 1px solid var(--bd); border-radius: 12px; box-shadow: var(--shl); padding: 12px; width: min(340px, 92vw); }

@media (max-width: 720px) {
  #app { padding: 0 8px 90px; }

.ui-r1 .ui-c-tabs { flex: 1 1 auto; min-width: 0; }
.ui-r1 .ui-groups { padding: 0; }
.ui-r3 .ui-c-search { flex: 1 1 260px; min-width: 200px; }
.ui-r3 .ui-search { flex: 1 1 auto; width: 100%; }
.ui-r3 .ui-c-class { flex: 0 1 auto; }
.ui-r3 .ui-c-view { flex: 1 1 auto; justify-content: flex-start; }
.ui-r2 .btn { min-height: 40px; }
.ui-r2 .btn .ico { margin-inline-end: 2px; }
.ui-lsel { display: flex; flex-direction: column; gap: 1px; min-width: 150px; }
.ui-lsel > span { font-size: 11px; color: var(--dm); font-weight: 700; padding-inline-start: 4px; }

/* item action icons: always visible, coloured, with a tinted hover */

.ui-acts button { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; border: 1px solid transparent; cursor: pointer; background: transparent; }
.ui-acts button .ic { width: 19px; height: 19px; }
.ui-acts button:hover { border-color: currentColor; }
.ui-acts button[data-act="speak"]:hover { background: #e3f5ea; } .ui-acts button[data-act="edit"]:hover { background: #e8f0fe; }
.ui-acts button[data-act="dup"]:hover { background: #efeafd; } .ui-acts button[data-act="hide"]:hover { background: #fdf1df; }
.ui-acts button[data-act="del"]:hover { background: #fdeceb; } .ui-acts button[data-act="up"]:hover, .ui-acts button[data-act="down"]:hover { background: #eef0f6; }
.ui-acts button[data-act="speak"] { color: #16a34a; } .ui-acts button[data-act="edit"] { color: #2563eb; } .ui-acts button[data-act="dup"] { color: #7c3aed; }
.ui-acts button[data-act="hide"] { color: #d97706; } .ui-acts button[data-act="del"] { color: #dc2626; } .ui-acts button[data-act="up"], .ui-acts button[data-act="down"] { color: #64748b; }
.ui-it:hover .ui-acts, .ui-cd:hover .ui-acts { opacity: 1; }

.ui-h1 a .ic { color: #fff; }

.ui-menu .btn { gap: 10px; } .ui-menu .btn .ic { width: 20px; height: 20px; }
.ui-menu .btn.pri .ic { color: #fff; }

@media (max-width: 720px) {

/* ---- compact top bar (smaller buttons) ---- */
.ui-top { padding: 4px 0 3px; }
.ui-row { gap: 9px; padding: 4px 2px; }

/* group-header checkbox: selects everything displayed in that main group / sub-group */

/* counts + sync status live in the same row as the view buttons (no extra line) */

.ui-r3 .ui-info { padding: 0; gap: 8px; flex-wrap: wrap; justify-content: flex-end; white-space: nowrap; }

@media (max-width: 720px) { .ui-r3 .ui-c-info { width: 100%; justify-content: flex-start; } .ui-r3 .ui-info { justify-content: flex-start; } }

/* ============ phones: words stacked tightly; action buttons appear only after tapping the word ============ */
@media (max-width: 720px) {
  .ui-it, .ui-cd { cursor: pointer; }
  .ui-it { padding: 5px 8px; margin-bottom: 2px; gap: 6px; border-radius: 8px; border-inline-start-width: 4px; }

  .ui-it.open .ui-acts { display: flex; flex: 1 1 100%; width: 100%; justify-content: space-between; gap: 2px; margin: 3px 0 0; padding-top: 5px; border-top: 1px dashed var(--bd); }
  .ui-it.open .ui-acts button { flex: 1 1 0; width: auto; height: 38px; }
  .ui-it .ui-meta { min-width: 0; flex-direction: row; gap: 4px; padding-top: 2px; }

  .ui-list.cards { grid-template-columns: 1fr; gap: 3px; }

  .ui-cd.open .ui-acts button { flex: 1 1 0; width: auto; height: 38px; }
  .ui-h1 { margin: 8px 0 3px; padding: 6px 10px; } .ui-h2 { margin: 5px 0 2px; padding: 3px 8px; }

/* phones: tighter lines so the words sit closer together */

/* ============ lock screen (secure build) ============ */
.ui-gate { min-height: 100vh; display: grid; place-items: center; padding: 18px; }
.ui-gate-box { width: min(480px, 100%); background: var(--card); border: 1px solid var(--bd); border-radius: 18px; box-shadow: var(--shl); padding: 22px 20px; text-align: center; }

/* ===== quiz.css ===== */
/* ============================================================
   quiz.css — quiz wizard + scores statistics. All classes prefixed qz-.
   Uses only the tokens from base.css (works in light and dark themes).
   ============================================================ */

/* ---------- modal shell ---------- */

.qz-sp { flex: 1; }
.qz-center { text-align: center; }
.qz-b { font-weight: 700; }

/* ---------- setup ---------- */
.qz-sum { font-size: 14px; margin-bottom: 12px; }
.qz-sum b { font-family: var(--fm); font-size: 18px; color: var(--pu); }
.qz-sec { margin-bottom: 14px; }
.qz-lab { font-size: 12.5px; font-weight: 700; color: var(--dm); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qz-chips { display: flex; flex-wrap: wrap; gap: 6px; }

.qz-chk { margin: 4px 0 8px; }
.qz-note { font-size: 12.5px; color: var(--dm); line-height: 1.8; background: var(--sf); border: 1px solid var(--bdl); border-radius: 6px; padding: 6px 10px; margin-top: 6px; }

.qz-det { border: 1px solid var(--bd); border-radius: var(--r); margin-top: 14px; background: var(--card); }
.qz-det > summary { cursor: pointer; padding: 10px 12px; font-weight: 700; font-size: 13.5px; list-style: none; display: flex; align-items: center; justify-content: space-between; }

.qz-det-b { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.qz-det-f { display: flex; gap: 8px; }

.qz-tbl th { background: var(--sf); color: var(--dm); font-size: 12px; font-weight: 700; }
.qz-tbl .qz-tl { text-align: start; font-weight: 700; white-space: nowrap; }
.qz-good { color: var(--gn); } .qz-badc { color: var(--acc); }
.qz-num { width: 64px; min-width: 56px; padding: 4px 6px; min-height: 32px; text-align: center; font-family: var(--fm); }
.qz-lims { display: flex; align-items: center; gap: 8px; font-size: 13px; }

/* ---------- run ---------- */
.qz-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 13px; }
.qz-cnt { font-family: var(--fm); font-weight: 700; color: var(--pu); }
.qz-c-ok { color: var(--gn); font-weight: 700; } .qz-c-bad { color: var(--acc); font-weight: 700; }
.qz-bar { height: 6px; background: var(--bdl); border-radius: 3px; overflow: hidden; }
.qz-bar i { display: block; height: 100%; background: var(--pu); transition: width .2s; }
.qz-dir { font-size: 12px; color: var(--pu); font-weight: 700; text-align: center; margin: 10px 0 6px; }
.qz-prompt { position: relative; text-align: center; padding: 20px 44px; background: var(--sf); border: 1px solid var(--bd); border-radius: var(--rl); margin-bottom: 12px; word-break: break-word; line-height: 1.5; }
.qz-prompt .t-zh { font-size: calc(40px * var(--f-all) * var(--f-zh)); }
.qz-prompt .t-pin { font-size: calc(24px * var(--f-all) * var(--f-pin)); }
.qz-prompt .t-ar { font-size: calc(26px * var(--f-all) * var(--f-ar)); font-weight: 700; }
.qz-prompt .t-en { font-size: calc(24px * var(--f-all) * var(--f-en)); color: var(--tx); font-weight: 600; }
.qz-prompt.long .t-zh { font-size: calc(26px * var(--f-all) * var(--f-zh)); }

.qz-prompt.long .t-ar { font-size: calc(19px * var(--f-all) * var(--f-ar)); }
.qz-prompt.long .t-en { font-size: calc(17px * var(--f-all) * var(--f-en)); }
.qz-spk { min-width: 34px; }
.qz-spk-p { position: absolute; top: 8px; inset-inline-end: 8px; }
.qz-hint { text-align: center; margin: -4px 0 10px; font-family: var(--fe); color: var(--bl); font-size: 17px; }

.qz-ans { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qz-choice { position: relative; padding: 12px 26px; min-height: 54px; border: 2px solid var(--bd); background: var(--card); border-radius: var(--r); cursor: pointer; text-align: center; color: var(--tx); font-weight: 600; font-size: 15px; word-break: break-word; transition: .12s; }
.qz-choice .t-zh { font-size: calc(22px * var(--f-all) * var(--f-zh)); }

.qz-choice:disabled { cursor: default; }
.qz-choice.ok { border-color: var(--gn); background: var(--gnl); }
.qz-choice.bad { border-color: var(--acc); background: var(--accl); }
.qz-k { position: absolute; top: 3px; inset-inline-end: 6px; font-size: 10px; color: var(--ft); font-family: var(--fm); }

.qz-stmt .t-ar { font-size: calc(22px * var(--f-all) * var(--f-ar)); font-weight: 600; }

.qz-stmt.long .t-ar { font-size: calc(17px * var(--f-all) * var(--f-ar)); }
.qz-stmt.long .t-en { font-size: calc(16px * var(--f-all) * var(--f-en)); }

.qz-in { width: 100%; padding: 12px; font-size: 18px; border: 2px solid var(--bd); border-radius: var(--r); outline: 0; text-align: center; background: var(--card); color: var(--tx); font-family: var(--fa); }
.qz-in[dir="ltr"] { font-family: var(--fe); }
.qz-in:focus { border-color: var(--pu); box-shadow: 0 0 0 3px rgba(109, 74, 216, .15); }
.qz-in:disabled { opacity: .75; }
.qz-pv { text-align: center; min-height: 24px; margin-top: 4px; font-family: var(--fe); color: var(--bl); font-size: 15px; }

.qz-fb { margin-top: 12px; padding: 10px 12px; border-radius: var(--r); font-size: 13.5px; line-height: 1.9; border: 1px solid var(--bd); }
.qz-fb.ok { background: var(--gnl); border-color: #27ae6050; }
.qz-fb.bad { background: var(--accl); border-color: #d6303150; }
.qz-fb.dk { background: var(--yl); border-color: #f59e0b50; }
.qz-fb-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qz-delta { font-family: var(--fm); }
.qz-right { margin-top: 2px; }
.qz-typed { font-size: 12.5px; color: var(--acc); }
.qz-word { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--bd); }
.qz-word .t-en { color: var(--tx); }

/* ---------- result / review ---------- */
.qz-res { text-align: center; padding: 6px 0 12px; }
.qz-pct { font-size: 56px; font-weight: 800; font-family: var(--fm); line-height: 1.1; }
.qz-p-good { color: var(--gn); } .qz-p-mid { color: var(--or); } .qz-p-bad { color: var(--acc); }
.qz-res-l { font-size: 13.5px; color: var(--dm); margin-top: 4px; }

.qz-sub.bad { color: var(--acc); }
.qz-sub-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.qz-mist { max-height: 42vh; overflow-y: auto; }
.qz-mrow { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--bdl); }
.qz-mt { flex: 1; min-width: 0; word-break: break-word; }
.qz-ar { color: var(--ft); }
.qz-rv-list { display: flex; flex-direction: column; gap: 10px; }
.qz-rv { border: 1px solid var(--bd); border-radius: var(--r); padding: 10px 12px; background: var(--card); }
.qz-rv-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.qz-rv-q { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.qz-rv-q .t-zh { font-size: calc(26px * var(--f-all) * var(--f-zh)); }

/* score badges */
.qz-rs { display: inline-flex; justify-content: center; align-items: center; min-width: 34px; padding: 1px 7px; border-radius: 10px; font-family: var(--fm); font-size: 12px; font-weight: 700; flex: none; direction: ltr; }
.qz-s-weak { background: var(--accl); color: var(--acc); }
.qz-s-mid { background: var(--yl); color: #92400e; }
.qz-s-strong { background: var(--gnl); color: var(--gn); }
.qz-s-none { background: var(--hov); color: var(--ft); }

/* ---------- stats ---------- */
.qz-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.qz-card { border: 1px solid var(--bd); border-top-width: 3px; border-radius: var(--r); padding: 8px 6px; text-align: center; background: var(--card); display: flex; flex-direction: column; gap: 2px; }
.qz-card b { font-family: var(--fm); font-size: 22px; line-height: 1.2; }
.qz-card span { font-size: 12px; color: var(--dm); }
.qz-card small { font-size: 10.5px; color: var(--ft); }
.qz-card.c-all { border-top-color: var(--bl); } .qz-card.c-none { border-top-color: var(--ft); }
.qz-card.c-weak { border-top-color: var(--acc); } .qz-card.c-weak b { color: var(--acc); }
.qz-card.c-mid { border-top-color: var(--or); } .qz-card.c-mid b { color: var(--or); }
.qz-card.c-strong { border-top-color: var(--gn); } .qz-card.c-strong b { color: var(--gn); }
.qz-card.c-avg { border-top-color: var(--pu); } .qz-card.c-n { border-top-color: var(--pu); }
.qz-dist { display: flex; align-items: stretch; gap: 4px; height: 150px; padding: 4px 0; }
.qz-dcol { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
.qz-dn { font-size: 11px; font-family: var(--fm); color: var(--dm); height: 16px; }
.qz-dbar-w { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }

mcOut_(body.action === 'sync' ? mcSync_(body) : mcInit_(body));\n    }\n    return mcOut_({ ok: false, error: 'unknown action' });\n  } catch (err) { return mcOut_({ ok: false, error: String(err && err.message || err) }); }\n}\n\n/* ---------------- device access control ---------------- */\nfunction mcValidDevice_(id) { return /^[0-9a-fA-F-]{16,64}$/.test(String(id || '')); }\nfunction mcTrue_(v) { return v === true || /^(true|yes|y|1|نعم|✓|✔)$/i.test(String(v === null || v === undefined ? '' : v).trim()); }\n// Pure: look a device id up in the Devices sheet values (header row first). Returns {state, row (1-based sheet row) | 0}.\n//  approved = `approved` ticked/TRUE, OR a manually pasted row (no requested_at) whose `approved` cell is empty.\nfunction mcDeviceState_(vals, id) {\n  if (!mcValidDevice_(id)) return { state: 'unknown', row: 0 };\n  var want = String(id).trim().toLowerCase();\n  for (var i = 1; i < vals.length; i++) {\n    var r = vals[i];\n    if (String(r[0] === null || r[0] === undefined ? '' : r[0]).trim().toLowerCase() !== want) continue;\n    var ap = r[2]; var requested = String(r[3] === null || r[3] === undefined ? '' : r[3]).trim();\n    var empty = String(ap === null || ap === undefined ? '' : ap).trim() === '';\n    if (mcTrue_(ap) || (empty && !requested)) return { state: 'approved', row: i + 1 };\n    return { state: 'pending', row: i + 1 };\n  }\n  return { state: 'unknown', row: 0 };\n}\nfunction mcDevSheet_(ss, create) {\n  var sh = ss.getSheetByName(MC_DEVICES);\n  if (sh && sh.getLastRow() >= 1) { // an older sheet used the header `device_id`: rename it to UUID (the column is read by position, so nothing else changes)\n    try { var a1 = String(sh.getRange(1, 1).getValues()[0][0]).trim(); if (a1.toLowerCase() === 'device_id') sh.getRange(1, 1).setValue(MC_DEV_HEADER[0]); } catch (e) { /* cosmetic */ }\n  }\n  if (!sh && create) {\n    sh = ss.insertSheet(MC_DEVICES);\n    sh.getRange(1, 1, 1, MC_DEV_HEADER.length).setValues([MC_DEV_HE  false, error: 'name required', message: 'اكتب اسم الجهاز أولًا' };\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    var sh = mcDevSheet_(ss, true); var vals = mcDevValues_(sh); var cur = mcDeviceState_(vals, id);\n    // ONE request per device: a second one never adds a row and never changes the name; the caller is told (already: true)\n    if (cur.state !== 'unknown') return { ok: true, state: cur.state, already: true, name: String(vals[cur.row - 1][1] || '') };\n    if (vals.length - 1 >= MC_DEV_MAX) return { ok: false, error: 'full', message: 'قائمة الطلبات ممتلئة؛ اطلب من المسؤول تنظيفها' };\n    var row = vals.length + 1;\n    sh.getRange(row, 1, 1, 5).setValues([[String(id).trim(), nm, false, new Date(), '']]);\n    var cb = sh.getRange(row, 3); if (cb && typeof cb.insertCheckboxes === 'function') cb.insertCheckboxes();\n    var tr = sh.getRange(2, 4, row - 1, 2); if (typeof tr.setNumberFormat === 'function') tr.setNumberFormat(MC_DEV_FMT);\n    return { ok: true, state: 'pending', already: false, name: nm };\n  } finally { lock.releaseLock(); }\n}\nfunction mcOut_(obj, callback) {\n  var json = JSON.stringify(obj);\n  if (callback && /^[A-Za-z_$][A-Za-z0-9_$.]*$/.test(callback)) {\n    return ContentService.createTextOutput(callback + '(' + json + ')').setMimeType(ContentService.MimeType.JAVASCRIPT);\n  }\n  return ContentService.createTextOutput(json).setMimeType(ContentService.MimeType.JSON);\n}\n\n/* ---------------- reading ---------------- */\nfunction mcCell_(v) {\n  if (v === null || v === undefined) return '';\n  if (Object.prototype.toString.call(v) === '[object Date]') return v.toISOString();\n  return v;\n}\n// allowMissing: for `load` — a spreadsheet without the 4 sheets (brand new) is reported as {empty:true} instead of an error.\nfunction mcLoadAll_(ss, allowMissing) {\n  var sheets = {}; var missing = [];\n  Object.keys(MC_SHEETS).forEach(function (name) {\n    var sh = ss.getSheetByName(name);\n    if (!sh) { if (allowMissing) { missing.push(name); return; } throw new Error('الورقة غير موجودة: ' + name); }\n    var vals = sh.getDataRange().getValues().map(function (r) { return r.map(mcCell_); });\n    sheets[name] = { rows: vals };\n  });\n  if (missing.length) return { ok: true, version: MC_VERSION, empty: true, missing: missing, rev: '', sheets: {} };\n  return { ok: true, version: MC_VERSION, rev: mcRev_(sheets), sheets: sheets };\n}\n// Revision = MD5 of all values (any change in the sheet, even manual, changes it).\nfunction mcRev_(sheets) {\n  var bytes = Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, JSON.stringify(sheets), Utilities.Charset.UTF_8);\n  return bytes.map(function (b) { b = (b < 0 ? b + 256 : b).toString(16); return b.length < 2 ? '0' + b : b; }).join('');\n}\n\n/* ---------------- pure logic (no Spreadsheet calls; unit-tested) ---------------- */\nfunction mcKey_(v) { return String(v === null || v === undefined ? '' : (typeof v === 'number' ? v : String(v).trim())); }\nfunction mcEmptyRow_(r) { return r.every(function (c) { return c === '' || c === null || c === undefined; }); }\n/**\n * vals: 2D array incl. header row. ops: {upsert:[objects], remove:[keys]}.\n * Returns {rows (no header), added, updated, removed}. Only columns named in spec.data are touched.\n */\nfunction mcApply_(vals, spec, ops) {\n  var header = vals[0].map(function (h) { return String(h).trim(); });\n  var ki = header.indexOf(spec.key);\n  if (ki < 0) throw new Error('العمود ' + spec.key + ' غير موجود');\n  spec.data.forEach(function (h) { if (header.indexOf(h) < 0) throw new Error('العمود ' + h + ' غير موجود'); });\n  var rows = vals.slice(1).filter(function (r) { return !mcEmptyRow_(r); }).map(function (r) { return r.slice(); });\n  var index = {}; rows.forEach(function (r, i) { index[mcKey_(r[ki])] = i; });\n  var res = { added: 0, updated: 0, removed: 0 };\n  var rm = {}; ((ops && ops.remove) || []).forEach(function (k) { rm[mcKey_(k)] = 1; });\n  ((ops && ops.upsert) || []).forEach(function (o) {\n    var k = mcKey_(o[spec.key]); if (!k) throw new Error('صف بلا مفتاح');\n    var i = index[k];\n    if (i === undefined) {\n      var row = header.map(function () { return ''; });\n      spec.data.forEach(function (h) { row[header.indexOf(h)] = o[h] === undefined || o[h] === null ? '' : o[h]; });\n      rows.push(row); index[k] = rows.length - 1; res.added++;\n    } else {\n      spec.data.forEach(function (h) { if (o[h] !== undefined) rows[i][header.indexOf(h)] = o[h] === null ? '' : o[h]; });\n      res.updated++;\n    }\n  });\n  if (Object.keys(rm).length) {\n    var before = rows.length; rows = rows.filter(function (r) { return !rm[mcKey_(r[ki])]; }); res.removed = before - rows.length;\n  }\n  res.rows = rows; return res;\n}\n\n/* ---------------- one-time initialisation of an EMPTY spreadsheet ---------------- */\n// Builds the four sheets with the Mychinese_Master_v3 layout (data columns + query formulas) from data posted by the app:\n// body = {action:'init', force?:bool, data:{groups:[..], class1:[..], class2:[..], items:[..]}}  (shapes as in the app: see src/core.js)\nfunction mcFormulas_(name, n) { // formulas for the query columns of rows 2..n+1\n  var f = []; var i, r;\n  for (i = 0; i < n; i++) {\n    r = i + 2;\n    if (name === 'Items') {\n      var q = function (col) { return '=INDEX(Class2!$' + col + ':$' + col + ',MATCH($B' + r + ',Class2!$A:$A,0))'; };\n      f.push([q('E'), q('B'), q('F'), q('G'), q('H'), q('C'), q('D'), '=INDEX(Groups!$D:$D,MATCH($H' + r + ',Groups!$A:$A,0))']);\n    } else { // Class2\n      var p = function (col) { return '=INDEX(Class1!$' + col + ':$' + col + ',MATCH($B' + r + ',Class1!$A:$A,0))'; };\n      f.push([p('B'), p('D'), p('C'), p('E')]);\n    }\n  }\n  return f;\n}\nvar MC_INIT_HEADERS = {\n  Items: ['id', 'c2', 'item_sort', 'ar', 'en', 'zh', 'pin', 'group', 'c1', 'level', 'c1_sort', 'c1_name', 'c2_sort', 'c2_name', 'group_ar'],\n  Class1: ['c1', 'group', 'c1_sort', 'level', 'c1_name', 'link'],\n  Class2: ['c2', 'c1', 'c2_sort', 'c2_name', 'group', 'level', 'c1_sort', 'c1_name'],\n  Groups: ['group', 'kind', 'scope', 'label_ar', 'label_en', 'group_sort']\n};\nfunction mcInitRows_(d) { // pure: data rows (data columns only) for each sheet\n  return {\n    Groups: d.groups.map(function (x) { return [x.group, x.kind, x.scope, x.label_ar, x.label_en, x.sort]; }),\n    Class1: d.class1.map(function (c) { return [c.c1, c.group, c.sort, c.level, c.name, c.link || '']; }),\n    Class2: d.class2.map(function (c) { return [c.c2, c.c1, c.sort, c.name]; }),\n    Items: d.items.map(function (i) { return [i.id, i.c2, i.sort, i.ar, i.en, i.zh, i.pin]; })\n  };\n}\nfunction mcInit_(body) {\n  var d = body.data; if (!d || !d.items || !d.class1 || !d.class2 || !d.groups) return { ok: false, error: 'بيانات التهيئة ناقصة' };\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var lock = LockService.getScriptLock(); lock.waitLock(25000);\n  try {\n    var existing = ss.getSheetByName('Items');\n    if (existing && existing.getLastRow() > 1 && !body.force) return { ok: false, error: 'not-empty', message: 'الشيت يحوي بيانات بالفعل (ورقة Items غير فارغة).' };\n    var rows = mcInitRows_(d); var made = {};\n    ['Groups', 'Class1', 'Class2', 'Items'].forEach(function (name) {\n      var sh = ss.getSheetByName(name) || ss.insertSheet(name); var hdr = MC_INIT_HEADERS[name]; var data = rows[name];\n      sh.clear();\n      sh.getRange(1, 1, 1, hdr.length).setValues([hdr]);\n      if (data.length) sh.getRange(2, 1, data.length, data[0].length).setValues(data);\n      if ((name === 'Items' || name === 'Class2') && data.length) { var fm = mcFormulas_(name, data.length); sh.getRange(2, data[0].length + 1, data.length, fm[0].length).setFormulas(fm); }\n      sh.setFrozenRows(1); sh.getRange(1, 1, 1, hdr.length).setFontWeight('bold'); sh.setRightToLeft(true);\n      made[name] = data.length;\n    });\n    // remove the default empty sheet(s) that came with a new spreadsheet\n    ss.getSheets().forEach(function (sh) { var n = sh.getName(); if (!MC_SHEETS[n] && sh.getLastRow() <= 1 && sh.getLastColumn() <= 1 && ss.getSheets().length > 4) ss.deleteSheet(sh); });\n    SpreadsheetApp.flush();\n    return { ok: true, rev: mcLoadAll_(ss).rev, created: made };\n  } finally { lock.releaseLock(); }\n}\n\n/* ---------------- writing ---------------- */\nfunction mcWriteTable_(sh, spec, ops) {\n  var vals = sh.getDataRange().getValues();\n  var header = vals[0].map(function (h) { return String(h).trim(); });\n  var oldN = vals.length - 1;\n  var res = mcApply_(vals, spec, ops);\n  var newN = res.rows.length;\n  if (newN > 0) {\n    spec.data.forEach(function (h) {\n      var j = header.indexOf(h);\n      sh.getRange(2, j + 1, newN, 1).setValues(res.rows.map(function (r) { return [r[j]]; }));\n    });\n  }\n  if (newN > oldN) { // new rows: copy the formulas of the non-data (query) columns from row 2\n    header.forEach(function (h, j) {\n      if (h === '' || spec.data.indexOf(h) >= 0) return;\n      sh.getRange(2, j + 1).copyTo(sh.getRange(oldN + 2, j + 1, newN - oldN, 1), SpreadsheetApp.CopyPasteType.PASTE_FORMULA, false);\n    });\n  } else if (newN < oldN) {\n    sh.deleteRows(newN + 2, oldN - newN);\n  }\n  return { added: res.added, updated: res.updated, removed: res.removed, rows: newN };\n}\nfunction mcSync_(body) {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var lock = LockService.getScriptLock(); lock.waitLock(25000);\n  try {\n    var cur = mcLoadAll_(ss);\n    if (body.baseRev && body.baseRev !== cur.rev) {\n      return { ok: false, error: 'conflict', message: 'تغيّرت البيانات في الشيت منذ آخر تحميل. حدّث من الشيت أولًا.', rev: cur.rev };\n    }\n    var summary = {};\n    // Order matters for readers of the sheet: classes first, then items.\n    ['Class1', 'Class2', 'Items'].forEach(function (name) {\n      var ops = body.ops && body.ops[name]; var spec = MC_SHEETS[name] <script>
/* ===== core.js ===== */
/* ============================================================
   core.js — data model, mutations, persistence, settings.
   No DOM access in this file (so it can be tested in Node).
   Everything is exposed on the global MC namespace.
   ============================================================ */
(function (g) {
  'use strict';
  const MC = (g.MC = g.MC || {});

  /* ---------- safe JSON storage (localStorage, falls back to memory) ---------- */
  const mem = {};
  let L = null;
  try { if (g.localStorage) { g.localStorage.setItem('__t', '1'); g.localStorage.removeItem('__t'); L = g.localStorage; } } catch (e) { L = null; }
  MC.store = {
    get(k, d) { try { const v = L ? L.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { const s = JSON.stringify(v); if (L) L.setItem(k, s); else mem[k] = s; return true; } catch (e) { return false; } },
    del(k) { try { if (L) L.removeItem(k); else delete mem[k]; } catch (e) { /* ignore */ } },
  };

  /* ---------- tiny event bus ---------- */
  const subs = {};
  MC.on = (ev, fn) => { (subs[ev] = subs[ev] || []).push(fn); return () => { subs[ev] = (subs[ev] || []).filter((f) => f !== fn); }; };
  MC.emit = (ev, p) => (subs[ev] || []).slice().forEach((f) => { try { f(p); } catch (e) { console.error(e); } });

  /* ---------- constants ---------- */
  // Display order of the four languages everywhere.
  MC.LANGS = [
    { key: 'zh', label: '中文' },
    { key: 'pin', label: 'بينيين' },
    { key: 'ar', label: 'عربي' },
    { key: 'en', label: 'English' },
  ];
  MC.GROUP_STYLE = {
    words_general: { color: '#2d6cdf', soft: '#e8f0fe' },
    words_specialized: { color: '#6d4ad8', soft: '#efeafd' },
    sentences_general: { color: '#e08a1e', soft: '#fdf1df' },
    sentences_specialized: { color: '#1f9d57', soft: '#e3f5ea' },
  };
  MC.groupStyle = (code) => MC.GROUP_STYLE[code] || { color: '#6b7280', soft: '#f1f2f6' };

  /* ---------- text helpers ---------- */
  // Search normalisation: lower-case, strip Arabic diacritics/tatweel, unify hamza/ya/ta-marbuta, strip pinyin tone marks.
  MC.norm = (s) => String(s == null ? '' : s)
    .normalize('NFD').replace(/[̀-ًͯ-ٰٟـ]/g, '').normalize('NFC')
    .toLowerCase().replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/\s+/g, ' ').trim();
  // Key used to detect duplicates: Chinese text without spaces/punctuation.
  MC.zhKey = (s) => String(s == null ? '' : s).replace(/[\s　]+/g, '').replace(/[\p{P}\p{S}]/gu, '').toLowerCase();

  /* ---------- data ---------- */
  MC.data = { groups: [], class1: [], class2: [], items: [] };
  MC.meta = { source: '', built: '', hash: '', working: false, baseChanged: false };
  let X = null; // lazily built index
  MC.invalidate = () => { X = null; };

  function byNum(a, b) { return a - b; }
  function build() {
    const d = MC.data;
    const x = { item: new Map(), c1: new Map(), c2: new Map(), grp: new Map(), c2Items: new Map(), c1C2: new Map(), grpC1: new Map(), blob: new Map() };
    d.groups.forEach((gr) => x.grp.set(gr.group, gr));
    d.class1.forEach((c) => x.c1.set(c.c1, c));
    d.class2.forEach((c) => x.c2.set(c.c2, c));
    d.items.forEach((i) => x.item.set(i.id, i));
    const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
    d.class1.forEach((c) => push(x.grpC1, c.group, c));
    d.class2.forEach((c) => push(x.c1C2, c.c1, c));
    d.items.forEach((i) => push(x.c2Items, i.c2, i));
    x.grpC1.forEach((a) => a.sort((p, q) => p.sort - q.sort || p.c1 - q.c1));
    x.c1C2.forEach((a) => a.sort((p, q) => p.sort - q.sort || p.c2 - q.c2));
    x.c2Items.forEach((a) => a.sort((p, q) => p.sort - q.sort || p.id - q.id));
    // display order: group -> c1 -> c2 -> item ; orphans last
    const groups = d.groups.slice().sort((p, q) => p.sort - q.sort);
    x.groupsSorted = groups;
    const ordered = [];
    const seen = new Set();
    groups.forEach((gr) => (x.grpC1.get(gr.group) || []).forEach((c1) => (x.c1C2.get(c1.c1) || []).forEach((c2) => (x.c2Items.get(c2.c2) || []).forEach((it) => { ordered.push(it); seen.add(it.id); }))));
    d.items.forEach((it) => { if (!seen.has(it.id)) ordered.push(it); });
    x.ordered = ordered;
    // duplicate map (by Chinese text)
    const dm = new Map();
    d.items.forEach((it) => { const k = MC.zhKey(it.zh); if (k) push(dm, k, it.id); });
    x.dup = new Map(); x.dupGroups = [];
    dm.forEach((ids) => { if (ids.length > 1) { ids.forEach((id) => x.dup.set(id, ids)); x.dupGroups.push(ids); } });
    return x;
  }
  const ix = () => X || (X = build());

  MC.getItem = (id) => ix().item.get(+id) || null;
  MC.getClass1 = (c1) => ix().c1.get(+c1) || null;
  MC.getClass2 = (c2) => ix().c2.get(+c2) || null;
  MC.getGroup = (code) => ix().grp.get(code) || null;
  MC.groupsSorted = () => ix().groupsSorted.slice();
  MC.class1Of = (group) => (ix().grpC1.get(group) || []).slice();   // sorted
  MC.class2Of = (c1) => (ix().c1C2.get(+c1) || []).slice();         // sorted
  MC.itemsOf = (c2) => (ix().c2Items.get(+c2) || []).slice();       // sorted
  MC.dupIds = (id) => ix().dup.get(+id) || null;                    // all ids sharing the same Chinese text (or null)
  MC.dupGroups = () => ix().dupGroups.slice();

  // Denormalised, read-only "view" of an item. This is what UI/print/quiz modules should consume.
  MC.view = (it) => {
    const c2 = ix().c2.get(it.c2) || {}; const c1 = ix().c1.get(c2.c1) || {}; const gr = ix().grp.get(c1.group) || {};
    return {
      id: it.id, c2: it.c2, sort: it.sort, ar: it.ar || '', en: it.en || '', zh: it.zh || '', pin: it.pin || '',
      c2name: c2.name || '', c1: c1.c1 == null ? null : c1.c1, c1name: c1.name || '', level: c1.level == null ? null : c1.level, link: c1.link || '',
      group: c1.group || '', groupLabel: gr.label_ar || c1.group || '', kind: gr.kind || '', scope: gr.scope || '',
    };
  };

  function blobOf(it) {
    const b = ix().blob; let s = b.get(it.id);
    if (s == null) { s = MC.norm([it.zh, it.pin, it.ar, it.en].join(' | ')); b.set(it.id, s); }
    return s;
  }

  /* ---------- hidden items (stored in this browser only; not part of the sheet) ---------- */
  const HKEY = 'mc.hidden.v1';
  const hidden = new Set((MC.store.get(HKEY, []) || []).map(Number));
  const saveHidden = () => { MC.store.set(HKEY, Array.from(hidden)); MC.emit('hidden'); };
  MC.isHidden = (id) => hidden.has(+id);
  MC.hiddenIds = () => Array.from(hidden).filter((id) => ix().item.has(id));
  MC.hiddenCount = () => MC.hiddenIds().length;
  MC.setHidden = (ids, flag) => { ids.forEach((id) => { if (flag) hidden.add(+id); else hidden.delete(+id); }); saveHidden(); };
  MC.clearHidden = () => { hidden.clear(); saveHidden(); };

  /* Query items (returns views in display order).
     f = { group:'code'|[codes], kind:'word'|'sentence', scope:'general'|'specialized', c1:n, c2:n, q:'text', ids:[...], dupOnly:bool,
           hidden:'exclude'|'only'|'all' }   hidden defaults to 'exclude' (items the user hid are not returned), or 'all' when `ids` is given. */
  MC.query = (f) => {
    f = f || {};

    c.types = (Array.isArray(c.types) ? c.types : ['mc']).filter((t, i, a) => TYPES.indexOf(t) >= 0 && a.indexOf(t) === i);
    c.count = Number(c.count) > 0 ? Math.floor(c.count) : 0;
    c.mode = MODES.indexOf(c.mode) >= 0 ? c.mode : 'random';
    c.noTones = !!c.noTones;
    c.rng = typeof c.rng === 'function' ? c.rng : Math.random;
    return c;
  }
  const _eligible = (it, c) => !!txt(it, c.a) && c.q.some((k) => k !== c.a && !!txt(it, k));

  /* Which items to ask, in which order. cfg: normalised config (+ optional cfg.info(id)->{s,n,t}|null). */
  function _selectItems(rows, cfg) {
    const c = _normCfg(cfg); const info = cfg && cfg.info ? cfg.info : (id) => MC.Scores.info(id);
    const seen = new Set();
    let list = (rows || []).filter((it) => { if (!it || seen.has(it.id) || !_eligible(it, c)) return false; seen.add(it.id); return true; });
    if (c.mode === 'untested') list = list.filter((it) => !info(it.id));
    else if (c.mode === 'random') list = shuffle(list, c.rng);
    else if (c.mode === 'weak') {
      const sc = (it) => { const r = info(it.id); return r ? (+r.s || 0) : 0; };
      list = shuffle(list, c.rng).map((it) => ({ it, s: sc(it) }));
      list.sort((a, b) => a.s - b.s); // stable: ties stay in shuffled order
      list = list.map((x) => x.it);
    }
    return c.count > 0 ? list.slice(0, c.count) : list;
  }

  /* Wrong options for `item` in language `lang`: same c2 first, then same c1, same group, same kind, anything.
     Never the item itself, never the same text (by comparison key), never an item that has the same prompt text. */
  function _pickDistractors(item, lang, n, pool, rng, o) {
    o = o || {}; rng = rng || Math.random; pool = pool || [];
    const kopt = { noTones: o.noTones };
    const keyOf = (x, l) => cmpKey(x[l], l, Object.assign({ sentence: x.kind === 'sentence' }, kopt));
    const seen = new Set([keyOf(item, lang)]);
    const qk = o.qLang && o.qLang !== lang && txt(item, o.qLang) ? keyOf(item, o.qLang) : null;
    const used = new Set([item.id]); const out = [];
    const tiers = [
      (x) => x.c2 === item.c2,
      (x) => x.c1 != null && x.c1 === item.c1,
      (x) => !!x.group && x.group === item.group,
      (x) => !!x.kind && x.kind === item.kind,
      () => true,
    ];
    for (let ti = 0; ti < tiers.length && out.length < n; ti++) {
      const t = tiers[ti];
      const cand = shuffle(pool.filter((x) => !used.has(x.id) && t(x) && txt(x, lang)), rng);
      for (let i = 0; i < cand.length && out.length < n; i++) {
        const x = cand[i]; const k = keyOf(x, lang);
        if (!k || seen.has(k)) continue;
        if (qk && txt(x, o.qLang) && keyOf(x, o.qLang) === qk) continue; // would be a second correct answer
        seen.add(k); used.add(x.id); out.push(x);
      }
    }
    return out;
  }

  function buildQuestion(it, q, type, c, pool, rng) {
    const base = {
      id: it.id, item: it, q, a: c.a, type, prompt: it[q], right: it[c.a], kind: it.kind,
      hintable: q === 'zh' && c.a !== 'pin' && !!txt(it, 'pin'),
      base: c.getScore ? c.getScore(it.id) : MC.Scores.get(it.id),
      done: false, hint: false, input: '', resp: null, outcome: null, delta: 0,
    };
    const dopt = { qLang: q, noTones: c.noTones };
    if (type === 'write') return base;
    if (type === 'mc') {
      const ds = _pickDistractors(it, c.a, 3, pool, rng, dopt);
      if (ds.length < 3) return null;
      base.opts = shuffle([{ text: it[c.a], correct: true }].concat(ds.map((x) => ({ text: x[c.a], correct: false }))), rng);
      return base;
    }
    // tf: half true statements, half false (a distractor's text shown)
    let truth = rng() < 0.5; let shown = it[c.a];
    if (!truth) { const ds = _pickDistractors(it, c.a, 1, pool, rng, dopt); if (ds.length) shown = ds[0][c.a]; else truth = true; }
    base.truth = truth; base.shown = shown;
    return base;
  }

  /* rows: views. cfg: {q:[langs], a, types:[...], count (0=all), mode, noTones, rng?, pool?, info?, getScore?}
     -> {questions:[...], dropped:[items for which no question could be built], eligible:n} */
  function _makeQuestions(rows, cfg) {
    const c = _normCfg(cfg); c.info = cfg && cfg.info; c.getScore = cfg && cfg.getScore;
    const pool = (cfg && cfg.pool) || MC.query({});
    const items = _selectItems(rows, Object.assign({}, c, { info: c.info }));
    const questions = []; const dropped = [];
    items.forEach((it) => {
      const qs = c.q.filter((k) => k !== c.a && txt(it, k));
      const q = qs[Math.floor(c.rng() * qs.length)];
      let made = null;
      const order = shuffle(c.types, c.rng);
      for (let i = 0; i < order.length && !made; i++) made = buildQuestion(it, q, order[i], c, pool, c.rng);
      if (made) questions.push(made); else dropped.push(it);
    });
    return { questions, dropped, eligible: (rows || []).filter((it) => _eligible(it, c)).length };
  }

  // resp: mc -> chosen option index; tf -> boolean; write -> typed string. Returns true when correct.
  function _grade(q, resp, o) {
    o = o || {};
    if (q.type === 'mc') return !!(q.opts[resp] && q.opts[resp].correct);
    if (q.type === 'tf') return resp === q.truth;
    return _checkAnswer(q.right, resp, q.a, { noTones: !!o.noTones, sentence: q.kind === 'sentence' });
  }
  // outcome: 'ok' | 'bad' | 'dk'. A used hint costs 1 point of a correct answer.
  function _deltaFor(type, outcome, hint, st) {
    st = st || settings();
    let d = num(st[type + '_' + outcome], 0);
    if (outcome === 'ok' && hint) d -= 1;
    return d;
  }
  function _summarize(qs) {
    const r = { total: qs.length, ok: 0, bad: 0, dk: 0, skipped: 0, unanswered: 0, answered: 0, points: 0, pct: 0, mistakes: [] };
    qs.forEach((q) => {
      if (!q.done) { r.unanswered++; return; }
      if (q.outcome === 'skip') { r.skipped++; return; }
      r.answered++; r.points += q.delta || 0;
      if (q.outcome === 'ok') r.ok++; else { if (q.outcome === 'dk') r.dk++; else r.bad++; r.mistakes.push(q); }
    });
    r.points = round2(r.points);
    r.pct = r.answered ? Math.round(r.ok * 100 / r.answered) : 0;
    return r;
  }
  // Answered (not skipped) questions -> [[id, totalDelta, attempts], ...]
  function _aggregate(qs) {
    const m = new Map();
    qs.forEach((q) => {
      if (!q.done || q.outcome === 'skip' || q.outcome == null) return;
      const e = m.get(q.id) || [q.id, 0, 0]; e[1] += q.delta || 0; e[2] += 1; m.set(q.id, e);
    });
    return Array.from(m.values());
  }
  // Statistics over a set of views. info(id) -> {s,n,t}|null
  function _computeStats(rows, info) {
    info = info || ((id) => MC.Scores.info(id));
    const st = { total: rows.length, untested: 0, weak: 0, medium: 0, strong: 0, tested: 0, sum: 0, tests: 0, avg: 0, dist: {}, weakest: [] };
    for (let k = -5; k <= 5; k++) st.dist[k] = 0;
    const tested = [];
    rows.forEach((it) => {
      const r = info(it.id);
      if (!r) { st.untested++; return; }
      const s = +r.s || 0;
      st.tested++; st.sum += s; st.tests += +r.n || 0;
      if (s < 0) st.weak++; else if (s < 3) st.medium++; else st.strong++;
      st.dist[Math.max(-5, Math.min(5, Math.round(s)))]++;
      tested.push({ item: it, s, n: +r.n || 0, t: +r.t || 0 });
    });
    st.avg = tested.length ? round2(st.sum / tested.length) : 0;
    st.sum = round2(st.sum);
    tested.sort((a, b) => a.s - b.s || a.t - b.t);
    st.weakest = tested.slice(0, 20);
    return st;
  }

  MC.Quiz = Object.assign(MC.Quiz || {}, {
    _makeQuestions, _selectItems, _pickDistractors, _checkAnswer, _grade, _deltaFor, _summarize, _aggregate, _computeStats,
    _cmpKey: cmpKey, _pyKey: pyKey, _pyNum: pyNum, _pyMark: pyMark, _normCfg,
  });

  /* =====================================================================
     4. UI (all DOM work is inside functions)
     ===================================================================== */
  function h() { return MC.h.apply(null, arguments); }
  const clear = (el) => { while (el.firstChild) el.removeChild(el.firstChild); };
  const LANG_LABEL = {}; MC.LANGS.forEach((l) => { LANG_LABEL[l.key] = l.label; });
  const TYPE_LABEL = { write: '⌨️ كتابة', mc: '🔘 اختيار من متعدد', tf: '⚖️ صح أم خطأ' };
  const TYPE_SHORT = { write: 'كتابة', mc: 'اختيار من متعدد', tf: 'صح أم خطأ' };
  const MODE_LABEL = { order: 'بالترتيب', random: 'عشوائي', weak: 'الأضعف أولاً', untested: 'غير المختبَرة فقط' };
  const fmt = (v) => (v > 0 ? '+' + v : String(v));
  const dirOf = (lang) => (lang === 'ar' ? 'rtl' : 'ltr');
  const canSpeak = () => !!(MC.canSpeak && MC.canSpeak());

  function langSpan(lang, text, cls) {
    return h('span', { class: 't-' + lang + (cls ? ' ' + cls : ''), dir: dirOf(lang), text: String(text == null ? '' : text) });
  }
  function speakBtn(text, cls) {
    if (!canSpeak() || !text) return null;
    return h('button', { class: 'btn sm ico qz-spk' + (cls ? ' ' + cls : ''), type: 'button', title: 'نطق', 'aria-label': 'نطق', text: '🔊', onclick: (e) => { e.stopPropagation(); MC.speak(text); } });
  }
  function scoreBadge(s, none) {
    if (none) return h('span', { class: 'qz-rs qz-s-none', text: '—' });
    return h('span', { class: 'qz-rs qz-s-' + levelOf(s), text: fmt(s) });
  }
  const chip = (label, on, onclick, extra) => h('button', { class: 'chip qz-chip' + (on ? ' on' : '') + (extra ? ' ' + extra : ''), type: 'button', onclick }, label);

  function defaultCfg(rows) {
    const sent = rows.filter((r) => r.kind === 'sentence').length > rows.length / 2;
    const sv = (qLoad().setup) || {};
    const typesSaved = sent ? sv.typesSentence : sv.typesWord;
    const cfg = {
      q: ['zh'], a: 'ar', types: sent ? ['mc', 'tf'] : ['write', 'mc', 'tf'], count: 10, mode: 'random', noTones: false,
    };
    if (sv.a && LANG_KEYS.indexOf(sv.a) >= 0) cfg.a = sv.a;
    if (Array.isArray(sv.q) && sv.q.length) cfg.q = sv.q;
    if (Array.isArray(typesSaved)) cfg.types = typesSaved;
    if (sv.count != null) cfg.count = sv.count;
    if (MODES.indexOf(sv.mode) >= 0) cfg.mode = sv.mode;
    if (sv.noTones) cfg.noTones = true;
    const out = _normCfg(cfg); delete out.rng; out.sentenceSet = sent;
    return out;
  }
  function saveSetup(cfg) {
    const q = qLoad(); const sv = q.setup = q.setup || {};
    sv.q = cfg.q.slice(); sv.a = cfg.a; sv.count = cfg.count; sv.mode = cfg.mode; sv.noTones = !!cfg.noTones;
    if (cfg.sentenceSet) sv.typesSentence = cfg.types.slice(); else sv.typesWord = cfg.types.slice();
    qSave();
  }

  /* ------------------------------------------------------------------
     MC.Quiz.open(rows, opts)
     ------------------------------------------------------------------ */
  function open(rows, opts) {
    opts = opts || {};
    rows = (rows || []).filter(Boolean);
    if (!rows.length) { MC.toast('لا توجد عناصر للاختبار', 'err'); return null; }
    const ui = { rows, cfg: defaultCfg(rows), phase: 'setup', session: null, scoreOpen: false, reviewing: false };
    const m = MC.modal.open({
      title: opts.title || 'اختبار', body: h('div', { class: 'qz-root' }), footer: [], className: 'qz-modal', width: '720px', persistent: true,
      onClose: () => {
        g.document.removeEventListener('keydown', onKey);
        const s = ui.session;
        if (s && !s.saved && s.qs.some((q) => q.done && q.outcome !== 'skip')) { const n = saveSession(); MC.toast('حُفظت درجات ' + n + ' سؤال', 'ok'); }
      },
    });
    g.document.addEventListener('keydown', onKey);

    const cur = () => ui.session && ui.session.qs[ui.session.i];
    function footerSet(btns) {
      clear(m.footer);
      btns.filter(Boolean).forEach((b) => m.footer.appendChild(h('button', { class: 'btn ' + (b.cls || ''), type: 'button', disabled: !!b.disabled, onclick: b.onClick }, b.label)));
    }

    /* ---------- score saving ---------- */
    function saveSession() {
      const s = ui.session; if (!s || s.saved) return 0;
      s.saved = true;
      const pairs = _aggregate(s.qs);
      if (pairs.length) MC.Scores.applyDeltas(pairs);
      s.after = {}; pairs.forEach((p) => { s.after[p[0]] = MC.Scores.get(p[0]); });
      return pairs.length;
    }

    /* ---------- session control ---------- */
    function allViews() { return ui.all || (ui.all = MC.query({})); } // distractor pool = the whole dictionary
    function startSession(srcRows, cfg) {
      cfg = Object.assign({}, cfg, { pool: allViews() });
      const res = _makeQuestions(srcRows, cfg);
      if (!res.questions.length) {
        let msg = 'تعذّر إنشاء أسئلة بالإعدادات المختارة';
        if (!res.eligible) msg = 'لا توجد عناصر فيها نص في لغة الإجابة ولغة السؤال المختارتين';
        else if (cfg.mode === 'untested') msg = 'كل العناصر سبق اختبارها — اختر نمطًا آخر';
        else if (cfg.types.length === 1 && cfg.types[0] === 'mc') msg = 'الاختيار من متعدد يحتاج 4 خيارات مختلفة على الأقل';
        MC.toast(msg, 'err'); return false;
      }
      if (res.dropped.length) MC.toast('تعذّر إنشاء سؤال لـ ' + res.dropped.length + ' عنصر وتم تجاهلها');
      ui.session = { cfg, st: MC.Scores.settings(), qs: res.questions, i: 0, saved: false };
      ui.phase = 'run'; ui.reviewing = false; renderRun(); return true;
    }
    function answer(resp, dk) {
      const q = cur(); if (!q || q.done) return;
      const s = ui.session; q.resp = resp; q.done = true;
      q.outcome = dk ? 'dk' : (_grade(q, resp, s.cfg) ? 'ok' : 'bad');
      q.delta = _deltaFor(q.type, q.outcome, q.hint, s.st);
      renderRun();
    }
    function skip() { const q = cur(); if (!q || q.done) return; q.done = true; q.outcome = 'skip'; q.delta = 0; next(); }
    function next() { const s = ui.session; if (s.i < s.qs.length - 1) { s.i++; renderRun(); } else finish(); }
    function finish() { saveSession(); ui.phase = 'result'; renderResult(); }
    function quit() {
      const n = ui.session.qs.filter((q) => q.done && q.outcome !== 'skip').length;
      MC.confirm(n ? 'إنهاء الاختبار الآن؟\nستُحفظ درجات ' + n + ' سؤال أجبت عنها.' : 'إنهاء الاختبار؟ لم تجب عن أي سؤال بعد.', { title: 'إنهاء الاختبار' }).then((ok) => {
        if (!ok) return; if (n) finish(); else m.close();
      });
    }
    function submitWrite() {
      const q = cur(); if (!q || q.done) return;
      const v = String(q.input || '').trim();
      if (!v) { MC.toast('اكتب إجابتك أولاً أو اضغط «لا أعرف»', 'err'); return; }
      answer(v);
    }

    /* ---------- keyboard ---------- */
    function onKey(e) {
      if (MC.modal.top() !== m || ui.phase !== 'run' || e.ctrlKey || e.metaKey || e.altKey) return;
      const q = cur(); if (!q) return;
      const tag = e.target && e.target.tagName;
      if (q.done) { if (e.key === 'Enter' && tag !== 'BUTTON' && !e.repeat) { e.preventDefault(); next(); } return; }
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (q.type === 'mc' && /^[1-9]$/.test(e.key) && +e.key <= q.opts.length) { e.preventDefault(); answer(+e.key - 1); }
      else if (q.type === 'tf' && (e.key === '1' || e.key === '2')) { e.preventDefault(); answer(e.key === '1'); }
      else if (e.key === '0') { e.preventDefault(); answer(null, true); }
    }

    /* ---------- setup screen ---------- */
    function renderSetup() {
      const cfg = ui.cfg; ui.phase = 'setup';
      m.setTitle(opts.title || 'اختبار');
      const body = m.body; clear(body);
      const c = _normCfg(cfg);
      const elig = rows.filter((it) => _eligible(it, c));
      const untested = elig.filter((it) => !MC.Scores.info(it.id)).length;
      const avail = cfg.mode === 'untested' ? untested : elig.length;
      const nq = cfg.count > 0 ? Math.min(cfg.count, avail) : avail;
      const nSent = rows.filter((r) => r.kind === 'sentence').length;

      const sec = (label, content, extra) => h('div', { class: 'qz-sec' }, h('div', { class: 'qz-lab' }, label, extra || null), content);

      // question languages (multi)
      const qChips = MC.LANGS.map((l) => {
        const isA = l.key === cfg.a; const on = cfg.q.indexOf(l.key) >= 0 && !isA;
        return chip((on ? '☑ ' : '☐ ') + l.label + (isA ? ' (= الإجابة)' : ''), on, () => {
          if (isA) return;
          if (on) { if (cfg.q.length === 1) { MC.toast('يجب اختيار لغة سؤال واحدة على الأقل', 'err'); return; } cfg.q = cfg.q.filter((k) => k !== l.key); } else cfg.q = cfg.q.concat([l.key]);
          renderSetup();
        }, isA ? 'dis' : '');
      });
      const aChips = MC.LANGS.map((l) => chip((cfg.a === l.key ? '◉ ' : '○ ') + l.label, cfg.a === l.key, () => {
        cfg.a = l.key; cfg.q = cfg.q.filter((k) => k !== l.key);
        if (!cfg.q.length) cfg.q = [l.key === 'zh' ? 'ar' : 'zh'];
        renderSetup();
      }));
      const tChips = TYPES.map((t) => chip((cfg.types.indexOf(t) >= 0 ? '☑ ' : '☐ ') + TYPE_LABEL[t], cfg.types.indexOf(t) >= 0, () => {
        cfg.types = cfg.types.indexOf(t) >= 0 ? cfg.types.filter((x) => x !== t) : cfg.types.concat([t]); renderSetup();
      }));
      const nChips = [10, 20, 50, 0].map((n) => chip(n === 0 ? 'الكل' : String(n), cfg.count === n, () => { cfg.count = n; renderSetup(); }));
      const mChips = MODES.map((k) => chip(MODE_LABEL[k] + (k === 'untested' ? ' (' + untested + ')' : ''), cfg.mode === k, () => { cfg.mode = k; renderSetup(); }));

      body.appendChild(h('div', { class: 'qz-sum' }, h('b', { text: String(rows.length) }), ' عنصرًا مُحددًا',
        nSent ? h('span', { class: 'qz-dim', text: ' (' + (rows.length - nSent) + ' كلمة، ' + nSent + ' جملة)' }) : null));
      body.appendChild(sec('❓ لغة السؤال', h('div', { class: 'qz-chips' }, qChips), h('span', { class: 'qz-dim', text: 'يمكن اختيار أكثر من لغة' })));
      body.appendChild(sec('✍️ لغة الإجابة', h('div', { class: 'qz-chips' }, aChips)));
      body.appendChild(sec('🧩 أنواع الأسئلة', h('div', { class: 'qz-chips' }, tChips)));
      body.appendChild(sec('🔢 عدد الأسئلة', h('div', { class: 'qz-chips' }, nChips)));
      body.appendChild(sec('📚 اختيار العناصر', h('div', { class: 'qz-chips' }, mChips)));

      if (cfg.a === 'pin' && cfg.types.indexOf('write') >= 0) {
        body.appendChild(h('label', { class: 'chk qz-chk' },
          h('input', { type: 'checkbox', checked: cfg.noTones ? true : null, onchange: (e) => { cfg.noTones = e.target.checked; } }),
          'تجاهل النغمات عند كتابة البينيين (yi zi بدل yǐ zi)'));
      }
      // notes
      const notes = [];
      if (nq > 0) notes.push(['ok', 'سيُطرح ' + nq + ' سؤالاً من ' + avail + ' عنصرًا صالحًا.']);
      else notes.push(['warn', cfg.mode === 'untested' && elig.length ? 'كل العناصر المحددة سبق اختبارها.' : 'لا توجد عناصر صالحة: تأكد أن العناصر فيها نص بلغة الإجابة وبلغة السؤال.']);
      if (!cfg.types.length) notes.push(['warn', 'اختر نوع سؤال واحدًا على الأقل.']);
      if (cfg.types.indexOf('mc') >= 0 && allViews().filter((x) => txt(x, cfg.a)).length < 4) notes.push(['warn', 'الاختيار من متعدد يحتاج 4 عناصر مختلفة على الأقل.']);
      if (nSent > rows.length / 2 && cfg.types.indexOf('write') >= 0) notes.push(['', 'الجمل طويلة: الكتابة تتجاهل علامات الترقيم والمسافات وحالة الأحرف، لكن يُفضَّل الاختيار وصح/خطأ.']);
      if (cfg.types.indexOf('write') >= 0 && cfg.a === 'pin') notes.push(['', 'اكتب البينيين بالعلامات (yǐ zi) أو بالأرقام (yi3 zi0) — المسافات اختيارية، ويُقبل حذف صفر النغمة الخفيفة.']);
      if (cfg.types.indexOf('write') >= 0 && cfg.a === 'zh') notes.push(['', 'كتابة الحروف الصينية تحتاج لوحة مفاتيح صينية (Pinyin IME) مفعّلة على جهازك.']);
      notes.forEach((n) => body.appendChild(h('div', { class: 'qz-note' + (n[0] === 'warn' ? ' warn' : n[0] === 'ok' ? ' ok' : ''), text: n[1] })));

      body.appendChild(scoringBox());

      footerSet([
        { label: '▶ ابدأ الاختبار', cls: 'pri', disabled: !(nq > 0 && cfg.types.length), onClick: () => { saveSetup(cfg); startSession(rows, Object.assign({}, cfg)); } },
        { label: '📊 الإحصائيات', onClick: () => openStats(rows) },
        { label: 'إلغاء', cls: 'ghost', onClick: () => m.close() },
      ]);
    }

    function scoringBox() {
      const st = MC.Scores.settings();
      const det = h('details', { class: 'qz-det' });

  function openStats(rowsIn) {

    const body = h('div', { class: 'qz-stats' });
    let unsub = null;
    const m = MC.modal.open({
      title: '📊 إحصائيات الدرجات' + (filtered ? ' — العناصر المحددة (' + filtered.length + ')' : ''),
      body, footer: [], className: 'qz-modal', width: '820px', onClose: () => { if (unsub) unsub(); },
    });

    function render() {
      const rows = getRows(); const st = _computeStats(rows, (id) => MC.Scores.info(id));
      clear(body);
      const card = (cls, label, val, sub) => h('div', { class: 'qz-card ' + cls }, h('b', { text: String(val) }), h('span', { text: label }), sub ? h('small', { text: sub }) : null);
      body.appendChild(h('div', { class: 'qz-cards' },
        card('c-all', 'إجمالي العناصر', st.total),
        card('c-none', '⚪ لم تُختبر', st.untested),
        card('c-weak', '🔴 ضعيفة (< 0)', st.weak),
        card('c-mid', '🟡 متوسطة (0 – 2)', st.medium),
        card('c-strong', '🟢 قوية (≥ 3)', st.strong),
        card('c-avg', 'متوسط الدرجة', fmt(st.avg), 'للعناصر المختبَرة'),
        card('c-n', 'عدد المحاولات', st.tests)));

      // distribution -5..+5
      const max = Math.max(1, ...Object.keys(st.dist).map((k) => st.dist[k]));
      const cols = [];
      for (let k = -5; k <= 5; k++) {
        const v = st.dist[k];
        cols.push(h('div', { class: 'qz-dcol' },
          h('span', { class: 'qz-dn', text: v ? String(v) : '' }),
          h('div', { class: 'qz-dbar-w' }, h('div', { class: 'qz-dbar ' + (k < 0 ? 'neg' : k === 0 ? 'zero' : 'pos'), style: { height: Math.round(v * 100 / max) + '%' } })),
          h('span', { class: 'qz-dl', dir: 'ltr', text: k === -5 ? '≤-5' : k === 5 ? '≥5' : fmt(k) })));
      }
      body.appendChild(h('div', { class: 'qz-sub', text: 'توزيع الدرجات' }));
      body.appendChild(h('div', { class: 'qz-dist', dir: 'ltr' }, cols));

      // weakest 20
      const wk = h('div', { class: 'qz-sub qz-sub-row' }, h('span', { text: 'أضعف ' + st.weakest.length + ' عنصرًا' }),
        st.weakest.length ? h('button', { class: 'btn sm pri', type: 'button', text: '🎯 اختبرني فيها', onclick: () => { const items = st.weakest.map((x) => x.item); m.close(); open(items, { title: 'اختبار الأضعف' }); } }) : null);
      body.appendChild(wk);

      else {

          h('thead', null, h('tr', null, h('th', { text: 'الدرجة' }), h('th', { text: '中文 / بينيين' }), h('th', { text: 'عربي' }), h('th', { text: 'English' }), h('th', { text: 'محاولات' }))),
          h('tbody', null, st.weakest.map((x) => h('tr', null,
            h('td', null, scoreBadge(x.s)),
            h('td', null, langSpan('zh', x.item.zh), ' ', speakBtn(x.item.zh), x.item.pin ? h('div', null, langSpan('pin', x.item.pin)) : null),
            h('td', null, langSpan('ar', x.item.ar)),
            h('td', null, langSpan('en', x.item.en)),

    async function doExport() {
      if (!MC.Scores.count()) { MC.toast('لا توجد درجات لتصديرها', 'err'); return; }

          body: h('div', { class: 'md-msg' },
            h('div', null, h('b', { text: 'دمج: ' }), 'يُبقي لكل عنصر السجل الأحدث (حسب تاريخ آخر اختبار) ويضيف الجديد.'),

    }

      MC.modal.open({

            h('thead', null, h('tr', null, h('th', { text: 'الصف' }), h('th', { text: 'id' }), h('th', { text: 'zh' }), h('th', { text: 'السبب' }))),
            h('tbody', null, r.skippedRows.map((x) => h('tr', null, h('td', { text: String(x.row) }), h('td', { text: x.id == null ? '' : String(x.id) }), h('td', { text: x.zh }), h('td', { text: x.reason }))))))),
        footer: [{ label: 'إغلاق', cls: 'pri', onClick: (close) => close() }],

    async function doClear() {

    const c2id = c2 && typeof c2 === 'object' ? c2.c2 : c2;
    const sel = c2id == null || c2id === '' || isNaN(+c2id) ? null : +c2id;
    const lookup = new Map();
    ((MC.data && MC.data.items) || []).forEach((it) => {
      const k = MC.zhKey(it.zh); if (!k) return;

      lookup.get(k).push(it);
    });
    const seen = new Map();
    return (items || []).map((x, i) => {
      const zh = str(x && x.zh).trim();
      const a = { status: 'ok', missing: !zh, dupPaste: false, dupDb: false, firstIdx: -1, existing: [], more: 0, key: '' };
      if (a.missing) { a.status = 'missing'; return a; }
      const key = MC.zhKey(zh); a.key = key;
      if (key) {
        if (seen.has(key)) { a.dupPaste = true; a.firstIdx = seen.get(key); } else seen.set(key, i);
        const ex = lookup.get(key);
        if (ex) {
          a.dupDb = true;
          const list = ex.map((it) => { const v = MC.view(it); return { id: it.id, group: v.group, groupLabel: v.groupLabel, c1: v.c1, c1name: v.c1name, c2: v.c2, c2name: v.c2name, sameC2: sel != null && it.c2 === sel }; });

  const PRESETS = [
    { label: 'عربي | صيني | بينين', map: ['ar', 'zh', 'pin'] },
    { label: 'عربي | إنجليزي | صيني | بينين', map: ['ar', 'en', 'zh', 'pin'] },
    { label: 'صيني | بينين | عربي', map: ['zh', 'pin', 'ar'] },

  /* ================= UI ================= */

  const MAP_OPTS = [
    { v: 'ar', t: 'عربي' }, { v: 'en', t: 'إنجليزي' }, { v: 'zh', t: 'صيني 中文' }, { v: 'pin', t: 'بينيين' }, { v: 'skip', t: 'تجاهل' },
  ];
  const DELIMS = [
    { v: 'auto', t: 'تلقائي' }, { v: 'tab', t: 'Tab (Excel)' }, { v: ',', t: 'فاصلة ,' }, { v: ';', t: 'فاصلة منقوطة ;' }, { v: 'none', t: 'بدون فاصل (عمود واحد)' },
  ];

  const NEW = 'new';

  function open(opts) {
    opts = opts || {};
    const h = MC.h; const esc = MC.esc;
    const prefs = Object.assign({ autofill: true, closeAfter: false }, MC.store ? MC.store.get('mc.bulk.prefs', {}) : {});

    const S = {

    const el = {};
    const savePrefs = () => { try { MC.store.set('mc.bulk.prefs', { autofill: S.autofill, closeAfter: S.closeAfter }); } catch (e) { /* ignore */ } };
    const coarse = !!(g.matchMedia && g.matchMedia('(pointer: coarse)').matches);

    // initial destination (optional preselection)

    /* ---------- destination ---------- */

    function renderDest() {
      const groups = MC.groupsSorted();

      const c1s = MC.class1Of(S.group);

      } else S.c2 = '';

      const gSel = mkSel(groups.map((x) => ({ v: x.group, t: x.label_ar || x.group })), S.group, (v) => { S.group = v; S.c1 = ''; S.c2 = ''; renderDest(); recompute(); });
