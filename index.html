<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>قاموس الصينية — كلمات وجمل</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232d6cdf'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='white'%3E字%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== base.css ===== */
/* ============================================================
   base.css — design tokens + shared components.
   Module CSS must use its own prefix (.pr- print, .qz- quiz, .bk- bulk, .ui- main UI)
   and rely only on the tokens/classes defined here.
   ============================================================ */
:root {
  --bg: #f3f4f8; --card: #fff; --sf: #f8f9fc; --hov: #eef0f6;
  --acc: #d63031; --accl: #fff1f0; --bl: #2d6cdf; --bll: #e8f0fe; --gn: #1f9d57; --gnl: #e3f5ea; --yl: #fef3c7; --or: #e08a1e; --orl: #fdf1df; --pu: #6d4ad8; --pul: #efeafd;
  --tx: #1a1d26; --dm: #6b7280; --ft: #9ca3af; --bd: #e2e5ed; --bdl: #eff1f5;
  --sh: 0 1px 3px rgba(0, 0, 0, .07); --shl: 0 12px 32px rgba(0, 0, 0, .16);
  --r: 8px; --rl: 14px;
  --fa: 'Tajawal', 'Segoe UI', Tahoma, 'Noto Naskh Arabic', Arial, sans-serif;
  --fz: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  --fe: 'Noto Sans', 'Segoe UI', Arial, sans-serif;
  --fm: 'IBM Plex Mono', Consolas, monospace;
  /* base text sizes in px; multiplied by the user's font factors */
  --b-zh: 22px; --b-pin: 14px; --b-ar: 16px; --b-en: 14px;
  --f-all: 1; --f-zh: 1; --f-pin: 1; --f-ar: 1; --f-en: 1;
}
:root[data-theme="dark"] {
  --bg: #12141a; --card: #1b1e27; --sf: #20242f; --hov: #272c39; --tx: #e8eaf0; --dm: #9aa3b5; --ft: #6c7487; --bd: #2d3342; --bdl: #252a37;
  --bll: #1c2a46; --gnl: #14301f; --accl: #3a1a1a; --orl: #3a2a12; --pul: #2a2247; --yl: #3a3414;
  --sh: 0 1px 3px rgba(0, 0, 0, .5); --shl: 0 12px 32px rgba(0, 0, 0, .6);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--fa); background: var(--bg); color: var(--tx); font-size: 15px; line-height: 1.5; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
html.md-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #c4c9d6; border-radius: 8px; }
[hidden] { display: none !important; }

/* language text classes (font factors applied) */
/* Chinese/pinyin are LTR text inside an RTL page: keep them LTR (so trailing punctuation stays on the right side of the text) but right-aligned. */
.t-zh { font-family: var(--fz); font-size: calc(var(--b-zh) * var(--f-all) * var(--f-zh)); line-height: 1.35; direction: ltr; text-align: right; }
.t-pin { font-family: var(--fe); font-size: calc(var(--b-pin) * var(--f-all) * var(--f-pin)); color: var(--bl); direction: ltr; text-align: right; }
.t-ar { font-family: var(--fa); font-size: calc(var(--b-ar) * var(--f-all) * var(--f-ar)); direction: rtl; }
.t-en { font-family: var(--fe); font-size: calc(var(--b-en) * var(--f-all) * var(--f-en)); direction: ltr; unicode-bidi: plaintext; color: var(--dm); }

/* icons (inline SVG): one colour per meaning, so actions are recognisable at a glance */
.ic { width: 1.25em; height: 1.25em; vertical-align: -.25em; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico { display: inline-flex; align-items: center; }
.ic-add { color: #2d6cdf; } .ic-bulk { color: #0ea5e9; } .ic-print { color: #0284c7; } .ic-quiz { color: #db2777; } .ic-stats { color: #7c3aed; }
.ic-settings { color: #475569; } .ic-data { color: #0f766e; } .ic-edit { color: #2563eb; } .ic-dup { color: #7c3aed; } .ic-del { color: #dc2626; }
.ic-speak { color: #16a34a; } .ic-hide { color: #d97706; } .ic-show { color: #0891b2; } .ic-up, .ic-down { color: #64748b; } .ic-cloud { color: #0ea5e9; }
.ic-layers { color: #6d4ad8; } .ic-link { color: #2563eb; } .ic-search { color: #64748b; } .ic-repeat { color: #7c3aed; } .ic-folder { color: #ca8a04; }
.ic-file { color: #16a34a; } .ic-download { color: #0f766e; } .ic-upload { color: #0369a1; } .ic-refresh { color: #2563eb; } .ic-check { color: #16a34a; } .ic-clean { color: #475569; } .ic-warn { color: #d97706; } .ic-x { color: #64748b; }
.btn.pri .ic, .btn.dng .ic, .btn.gn .ic, .chip.on .ic, .seg button.on .ic, .ui-selbar .ic { color: #fff; }
:root[data-theme="dark"] .ic { filter: brightness(1.35); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 6px 14px; border: 1px solid var(--bd); background: var(--card); border-radius: var(--r); cursor: pointer; font-weight: 500; font-size: 13.5px; transition: .12s; white-space: nowrap; }
.btn:hover { background: var(--hov); } .btn:active { transform: translateY(1px); }
.btn.pri { background: var(--bl); border-color: var(--bl); color: #fff; } .btn.pri:hover { filter: brightness(1.08); }
.btn.dng { background: var(--acc); border-color: var(--acc); color: #fff; } .btn.dng:hover { filter: brightness(1.08); }
.btn.gn { background: var(--gn); border-color: var(--gn); color: #fff; }
.btn.ghost { background: transparent; } .btn.sm { min-height: 30px; padding: 3px 10px; font-size: 12.5px; }
.btn.ico { min-width: 34px; padding: 4px 8px; } .btn[disabled] { opacity: .45; pointer-events: none; }

/* forms */
.fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; min-width: 0; }
.fld > label, .lbl { font-size: 12.5px; color: var(--dm); font-weight: 500; }
.inp, .sel, .txa { width: 100%; padding: 7px 10px; min-height: 36px; border: 1px solid var(--bd); border-radius: var(--r); background: var(--card); outline: 0; transition: .12s; }
.inp:focus, .sel:focus, .txa:focus { border-color: var(--bl); box-shadow: 0 0 0 3px rgba(45, 108, 223, .15); }
.txa { resize: vertical; min-height: 64px; }
.inp.zh, .txa.zh { font-family: var(--fz); font-size: 18px; direction: ltr; text-align: left; } .inp.en, .txa.en { direction: ltr; text-align: left; font-family: var(--fe); } .inp.pin, .txa.pin { direction: ltr; text-align: left; font-family: var(--fe); }
.row { display: flex; gap: 10px; flex-wrap: wrap; } .row > * { flex: 1 1 160px; min-width: 0; } .row.nogrow > * { flex: 0 0 auto; }
.hint { font-size: 12px; color: var(--dm); } .err-t { color: var(--acc); }
.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: 13.5px; } .chk input { width: 17px; height: 17px; accent-color: var(--bl); }

/* segmented control */
.seg { display: inline-flex; border: 1px solid var(--bd); border-radius: var(--r); overflow: hidden; background: var(--card); }
.seg button { border: 0; border-inline-start: 1px solid var(--bd); background: transparent; padding: 6px 12px; cursor: pointer; font-size: 13px; min-height: 34px; }
.seg button:first-child { border-inline-start: 0; } .seg button.on { background: var(--bl); color: #fff; }

/* chips / tags */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--bd); background: var(--card); cursor: pointer; font-size: 13px; user-select: none; transition: .12s; }
.chip:hover { background: var(--hov); } .chip.on { background: var(--bl); border-color: var(--bl); color: #fff; }
.chip .n { font-size: 11px; opacity: .75; font-family: var(--fm); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; background: var(--hov); color: var(--dm); }
.tag.warn { background: var(--yl); color: #92400e; } .tag.ok { background: var(--gnl); color: var(--gn); } .tag.bad { background: var(--accl); color: var(--acc); }

/* panels */
.panel { background: var(--card); border: 1px solid var(--bd); border-radius: var(--rl); padding: 12px 14px; box-shadow: var(--sh); }
.panel + .panel { margin-top: 10px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; } .tbl th, .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--bdl); text-align: start; vertical-align: top; } .tbl th { background: var(--sf); color: var(--dm); font-weight: 600; position: sticky; top: 0; }
.scroll-y { overflow: auto; max-height: 55vh; }

/* modal */
.md-back { position: fixed; inset: 0; background: rgba(15, 18, 28, .55); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 16px; animation: mdfade .15s; backdrop-filter: blur(2px); }
.md-box { background: var(--card); border-radius: var(--rl); width: 100%; max-width: 760px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: var(--shl); overflow: hidden; animation: mdup .18s; }
.md-box.md-sm { max-width: 420px; } .md-box.md-lg { max-width: 1000px; } .md-box.md-full { max-width: 1200px; height: calc(100vh - 32px); }
.md-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--bd); }
.md-title { font-weight: 700; font-size: 16px; } .md-x { border: 0; background: transparent; font-size: 26px; line-height: 1; cursor: pointer; color: var(--dm); padding: 0 6px; } .md-x:hover { color: var(--acc); }
.md-body { padding: 14px 16px; overflow: auto; flex: 1 1 auto; } .md-foot { display: flex; gap: 8px; justify-content: flex-start; flex-wrap: wrap; padding: 10px 16px; border-top: 1px solid var(--bd); background: var(--sf); }
.md-msg { line-height: 1.7; margin-bottom: 8px; }
@keyframes mdfade { from { opacity: 0; } to { opacity: 1; } } @keyframes mdup { from { transform: translateY(14px); opacity: .5; } to { transform: none; opacity: 1; } }
@media (max-width: 640px) { .md-back { padding: 0; align-items: flex-end; } .md-box { max-width: none !important; border-radius: var(--rl) var(--rl) 0 0; max-height: 94vh; } .md-box.md-full { height: 94vh; } }

/* toast */
.toast { position: fixed; bottom: 18px; left: 50%; transform: translate(-50%, 80px); background: var(--tx); color: var(--bg); padding: 8px 20px; border-radius: var(--r); font-size: 13px; z-index: 900; box-shadow: var(--shl); transition: transform .25s; pointer-events: none; max-width: 90vw; }
.toast.show { transform: translate(-50%, 0); } .toast.err { background: var(--acc); color: #fff; } .toast.ok { background: var(--gn); color: #fff; }

@media print { .toast, .md-back { display: none !important; } }

/* ===== ui.css ===== */
/* ============================================================
   ui.css — main screen (prefix .ui-)
   ============================================================ */
#app { max-width: 1280px; margin: 0 auto; padding: 0 12px 90px; }

/* ---- top bar ---- */
.ui-top { position: sticky; top: 0; z-index: 40; background: var(--bg); padding: 10px 0 8px; }
.ui-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ui-brand { font-weight: 800; font-size: 19px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.ui-brand .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--bl), var(--pu) 60%, var(--or)); color: #fff; display: grid; place-items: center; font-family: var(--fz); font-size: 19px; box-shadow: var(--sh); }
.ui-search { position: relative; flex: 1 1 260px; min-width: 180px; }
.ui-search .inp { padding-inline-end: 34px; border-radius: 999px; min-height: 40px; }
.ui-search button { position: absolute; inset-inline-end: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; cursor: pointer; font-size: 18px; color: var(--dm); width: 28px; height: 28px; border-radius: 50%; }
.ui-search button:hover { background: var(--hov); }
.ui-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.ui-actions .btn { min-height: 40px; }
.ui-groups { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 4px; scrollbar-width: none; }
.ui-groups::-webkit-scrollbar { display: none; }
.ui-gchip { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 12px; border: 1.5px solid var(--bd); background: var(--card); cursor: pointer; font-weight: 600; font-size: 14px; transition: .12s; }
.ui-gchip i { width: 10px; height: 10px; border-radius: 50%; background: var(--gc, var(--dm)); display: inline-block; }
.ui-gchip .n { font-size: 11px; font-family: var(--fm); color: var(--dm); font-weight: 500; }
.ui-gchip:hover { border-color: var(--gc, var(--bl)); }
.ui-gchip.on { background: var(--gc, var(--bl)); border-color: var(--gc, var(--bl)); color: #fff; box-shadow: var(--sh); }
.ui-gchip.on i { background: #fff; } .ui-gchip.on .n { color: rgba(255, 255, 255, .85); }
.ui-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 6px 0 2px; }
.ui-filters .sel { width: auto; min-width: 150px; max-width: 240px; flex: 1 1 150px; }
.ui-sp { flex: 1 1 10px; }
.ui-lang { display: inline-flex; gap: 4px; }
.ui-lang button { border: 1.5px solid var(--bd); background: var(--card); border-radius: 8px; padding: 3px 9px; min-height: 34px; cursor: pointer; font-size: 13px; transition: .1s; }
.ui-lang button.on { background: var(--bll); border-color: var(--bl); color: var(--bl); font-weight: 700; }
.ui-lang button.off { opacity: .55; text-decoration: line-through; }
.ui-info { font-size: 12.5px; color: var(--dm); padding: 2px 2px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ui-banner { background: var(--yl); border: 1px solid #f1d98b; color: #78350f; padding: 8px 12px; border-radius: var(--r); margin: 6px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }

/* ---- selection bar ---- */
.ui-selbar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--tx); color: var(--bg); padding: 8px 12px; border-radius: 14px; display: flex; gap: 6px; align-items: center; box-shadow: var(--shl); flex-wrap: wrap; justify-content: center; max-width: 96vw; }
.ui-selbar .btn { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .25); color: inherit; min-height: 32px; font-size: 13px; }
.ui-selbar .btn:hover { background: rgba(255, 255, 255, .24); } .ui-selbar .btn.dng { background: var(--acc); }
.ui-selbar b { padding: 0 6px; }

/* ---- list ---- */
.ui-list { margin-top: 6px; }
.ui-h1 { margin: 16px 0 6px; padding: 9px 14px; border-radius: 12px; background: var(--gc); color: #fff; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; box-shadow: var(--sh); }
.ui-h1 .sep { opacity: .6; } .ui-h1 .n { margin-inline-start: auto; font-family: var(--fm); font-size: 12px; background: rgba(255, 255, 255, .22); padding: 1px 9px; border-radius: 999px; }
.ui-h1 a { color: #fff; text-decoration: none; background: rgba(255, 255, 255, .22); border-radius: 999px; padding: 0 9px; font-size: 12px; }
.ui-h1 .tag { background: rgba(255, 255, 255, .22); color: #fff; }
.ui-h2 { margin: 10px 0 4px; padding: 4px 12px; font-weight: 700; color: var(--gc); border-inline-start: 4px solid var(--gc); display: flex; gap: 8px; align-items: center; font-size: 14.5px; background: var(--gs); border-radius: 0 8px 8px 0; }
.ui-h2 .n { font-family: var(--fm); font-size: 11.5px; color: var(--dm); font-weight: 500; }
.ui-h2 .btn { margin-inline-start: auto; min-height: 26px; padding: 0 8px; font-size: 12px; }

.ui-it { display: flex; align-items: flex-start; gap: 8px; background: var(--card); border: 1px solid var(--bd); border-inline-start: 4px solid var(--gc, var(--bd)); border-radius: 10px; padding: 8px 10px; margin-bottom: 5px; transition: box-shadow .12s, background .12s; }
.ui-it:hover { box-shadow: var(--sh); background: color-mix(in srgb, var(--gs, #fff) 40%, var(--card)); }
.ui-it.sel { background: var(--bll); border-color: var(--bl); }
.ui-no { flex: none; font-family: var(--fm); font-size: 11px; color: var(--ft); min-width: 22px; text-align: center; padding-top: 6px; }
.ui-sel { flex: none; padding-top: 4px; } .ui-sel input { width: 18px; height: 18px; accent-color: var(--bl); cursor: pointer; }
.ui-cells { flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: var(--cols, 1fr); gap: 2px 16px; align-items: baseline; }
.ui-cells > div { min-width: 0; overflow-wrap: anywhere; }
.ui-meta { flex: none; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; min-width: 54px; }
.ui-acts { flex: none; display: flex; gap: 2px; opacity: .55; transition: opacity .12s; }
.ui-it:hover .ui-acts, .ui-cd:hover .ui-acts, .ui-acts:focus-within { opacity: 1; }
.ui-acts button { border: 0; background: transparent; cursor: pointer; width: 30px; height: 30px; border-radius: 8px; font-size: 15px; line-height: 1; }
.ui-acts button:hover { background: var(--hov); } .ui-acts button.d:hover { background: var(--accl); }
.ui-sc { font-family: var(--fm); font-size: 11px; border-radius: 999px; padding: 0 7px; background: var(--hov); color: var(--dm); }
.ui-sc.neg { background: var(--accl); color: var(--acc); } .ui-sc.mid { background: var(--yl); color: #92400e; } .ui-sc.pos { background: var(--gnl); color: var(--gn); }

.ui-list.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; align-items: start; }
.ui-list.cards > .ui-h1, .ui-list.cards > .ui-h2, .ui-list.cards > .ui-empty { grid-column: 1 / -1; }
.ui-list.cards > .ui-h1 { margin-bottom: 0; }
.ui-cd { background: var(--card); border: 1px solid var(--bd); border-top: 4px solid var(--gc, var(--bd)); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; box-shadow: var(--sh); transition: transform .12s; position: relative; }
.ui-cd:hover { transform: translateY(-2px); } .ui-cd.sel { background: var(--bll); outline: 2px solid var(--bl); }
.ui-cd-top { display: flex; align-items: center; gap: 6px; min-height: 26px; } .ui-cd-top .ui-no { padding: 0; }
.ui-cd .t-zh { text-align: center; padding: 4px 0 0; } .ui-cd .t-pin { text-align: center; } .ui-cd .t-ar { text-align: center; border-top: 1px dashed var(--bdl); padding-top: 5px; margin-top: 3px; } .ui-cd .t-en { text-align: center; }
.ui-cd .ui-acts { justify-content: center; margin-top: 4px; }
.ui-empty { text-align: center; padding: 60px 10px; color: var(--dm); }
.ui-empty .big { font-size: 42px; }
.ui-more { text-align: center; padding: 14px; color: var(--dm); font-size: 13px; }

/* ---- dialogs ---- */
.ui-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } @media (max-width: 640px) { .ui-two { grid-template-columns: 1fr; } }
.ui-dupnote { font-size: 12px; color: #92400e; background: var(--yl); border-radius: 6px; padding: 3px 8px; margin-top: 3px; }
.ui-cls-c1 { border: 1px solid var(--bd); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.ui-cls-c1 > .hd { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--gs); border-inline-start: 4px solid var(--gc); font-weight: 700; flex-wrap: wrap; }
.ui-cls-c2 { display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 10px; border-top: 1px solid var(--bdl); font-size: 14px; }
.ui-cls-c2 .nm, .ui-cls-c1 .nm { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.ui-cls-c2 .n, .ui-cls-c1 .n { font-family: var(--fm); font-size: 11.5px; color: var(--dm); }
.ui-slid { display: grid; grid-template-columns: 90px 1fr 54px; gap: 10px; align-items: center; margin-bottom: 8px; } .ui-slid input[type=range] { width: 100%; accent-color: var(--bl); }
.ui-slid output { font-family: var(--fm); font-size: 12.5px; text-align: center; }
.ui-sample { border: 1px dashed var(--bd); border-radius: 10px; padding: 10px; display: grid; gap: 2px; background: var(--sf); }
.ui-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin-bottom: 8px; } .ui-kv dt { color: var(--dm); } .ui-kv dd { margin: 0; }
.ui-menu { display: grid; gap: 8px; } .ui-menu .btn { justify-content: flex-start; min-height: 42px; width: 100%; }
.ui-pop { position: absolute; z-index: 80; background: var(--card); border: 1px solid var(--bd); border-radius: 12px; box-shadow: var(--shl); padding: 12px; width: min(340px, 92vw); }

@media (max-width: 720px) {
  #app { padding: 0 8px 90px; }
  .ui-top { position: static; } /* the header is tall on phones: let it scroll away */
  .ui-brand span.t { display: none; }

/* ===== print.css ===== */
/* ============================================================
   print.css — print dialog (.pr-o*, .pr-wrap, .pr-pv*) and the printable document (.pr-*, #mc-print-root).
   The same document classes style both the live preview and the real print output.
   @page itself is injected dynamically by print.js.
   ============================================================ */

/* ---------- options dialog ---------- */
.pr-wrap { display: grid; grid-template-columns: minmax(300px, 410px) minmax(0, 1fr); gap: 18px; align-items: start; }
.pr-opts { min-width: 0; }
.pr-side { position: sticky; top: 0; min-width: 0; }
.pr-orow { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 11px; flex-wrap: wrap; }
.pr-olbl { flex: 0 0 82px; font-size: 12.5px; color: var(--dm); font-weight: 600; padding-top: 7px; }
.pr-octl { flex: 1 1 190px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; min-width: 0; }
.pr-step { display: inline-flex; align-items: center; gap: 4px; }
.pr-step-l { font-size: 12px; color: var(--dm); min-width: 34px; }
.pr-step .inp { width: 58px; min-height: 30px; padding: 3px 4px; text-align: center; direction: ltr; -moz-appearance: textfield; }
.pr-step .inp::-webkit-inner-spin-button, .pr-step .inp::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.pr-note { line-height: 1.7; margin: 4px 0 8px; }
.pr-info { background: var(--sf); border: 1px solid var(--bd); border-radius: var(--r); padding: 8px 12px; margin-bottom: 10px; font-size: 13px; line-height: 1.7; }
.pr-info .pr-big { font-size: 13px; } .pr-info .pr-big b { font-size: 24px; color: var(--bl); font-family: var(--fm); margin-inline-end: 4px; }
.pr-info .pr-sub { color: var(--dm); font-size: 12.5px; }
.pr-warn { color: var(--acc); font-size: 12.5px; margin-top: 6px; font-weight: 600; }
.pr-pv { overflow: hidden; }
.pr-pv-pair { display: flex; gap: 12px; justify-content: center; }
.pr-pv-cell { min-width: 0; }
.pr-pv-page { position: relative; overflow: hidden; background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .25); border: 1px solid #bbb; margin: 0 auto; }
.pr-pv-lbl { text-align: center; font-size: 11px; color: var(--dm); margin: 4px 0 8px; }
.pr-pv-foot { position: absolute; left: 10mm; right: 10mm; bottom: 4mm; display: flex; justify-content: space-between; font-size: 8pt; color: #888; direction: rtl; }
@media (max-width: 760px) {
  .pr-wrap { grid-template-columns: 1fr; }
  .pr-side { position: static; }
  .pr-olbl { flex-basis: 100%; padding-top: 0; }
}

/* ---------- printable document (preview + real print) ---------- */
.pr-doc, #mc-print-root {
  direction: rtl; color: #000; background: #fff; font-family: var(--fa, 'Tajawal', 'Segoe UI', Tahoma, 'Noto Naskh Arabic', Arial, sans-serif); font-size: 10pt; line-height: 1.4;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.pr-doc { position: absolute; top: 0; left: 0; transform-origin: top left; box-sizing: border-box; overflow: hidden; }
#mc-print-root { display: none; }
.pr-doc *, #mc-print-root * { box-sizing: border-box; }

/* language fonts / colours (sizes come from --pr-zh etc. set on the document root) */
.pr-zh { font-size: var(--pr-zh, 18pt); font-weight: 800; color: #c0392b; font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'SimSun', sans-serif; line-height: 1.3; }
.pr-pin { font-size: var(--pr-pin, 11pt); color: #2d2d3a; font-family: 'Noto Sans', 'Segoe UI', Arial, sans-serif; line-height: 1.3; direction: ltr; unicode-bidi: plaintext; }
.pr-ar { font-size: var(--pr-ar, 9pt); font-weight: 600; color: #333; font-family: 'Tajawal', 'Segoe UI', Tahoma, 'Noto Naskh Arabic', Arial, sans-serif; line-height: 1.4; direction: rtl; }
.pr-en { font-size: var(--pr-en, 8pt); color: #2c5282; font-family: 'Noto Sans', 'Segoe UI', Arial, sans-serif; line-height: 1.3; direction: ltr; unicode-bidi: plaintext; }

/* page frame: title, grid, footer */
.pr-pg { position: relative; overflow: hidden; break-after: page; page-break-after: always; }
.pr-pg:last-child { break-after: auto; page-break-after: auto; }
.pr-title { display: flex; align-items: center; justify-content: center; text-align: center; font-size: 9pt; color: #888; border-bottom: 1px solid #ddd; overflow: hidden; white-space: nowrap; }
.pr-pg .pr-title { padding-bottom: 1mm; }
.pr-foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; font-size: 8pt; color: #999; border-top: 1px solid #ddd; padding-top: 1mm; }
.pr-grid { display: flex; flex-direction: column; }
.pr-crow { display: grid; justify-content: start; }

/* cards */
.pr-card { position: relative; border: 1px solid #999; border-radius: 4px; padding: 2.5mm 3mm; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1mm; overflow: hidden; break-inside: avoid; overflow-wrap: anywhere; background: #fff; }
.pr-card.pr-fr-dashed { border-style: dashed; }
.pr-card.pr-fr-none { border-color: transparent; }
.pr-card.pr-ph { border: 0; visibility: hidden; }
.pr-card .pr-pin { margin-bottom: 1mm; }
.pr-card.pr-big .pr-ar { font-weight: 800; }
.pr-card.pr-big .pr-en { font-weight: 600; }
.pr-num { position: absolute; top: 1mm; left: 1.5mm; font-size: 6pt; color: #999; font-family: 'IBM Plex Mono', Consolas, monospace; direction: ltr; }
.pr-cat { display: block; text-align: center; font-size: 10.5pt; font-weight: 800; color: #222; background: #e8e8e8; border-radius: 3px; padding: 0 3mm; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pr-cat small { font-weight: 500; font-size: 8pt; color: #666; }

/* list (table) */
.pr-list { width: 100%; }
.pr-ltitle { margin-bottom: 0; }
.pr-lcat { display: block; text-align: center; font-weight: 800; font-size: 11pt; color: #222; background: #e8e8e8; border-radius: 3px; padding: 1.5mm; margin: 3mm 0 1.5mm; break-after: avoid; page-break-after: avoid; }
.pr-lcat.brk, .pr-tbl.brk { break-before: page; page-break-before: always; }
.pr-tbl { width: 100%; border-collapse: collapse; margin-bottom: 2mm; }
.pr-tbl thead { display: table-header-group; }
.pr-tbl tr { break-inside: avoid; page-break-inside: avoid; }
.pr-tbl th { background: #f0f0f0; padding: 1.2mm 2mm; border: 1px solid #bbb; font-size: 8pt; font-weight: 700; text-align: center; color: #222; }
.pr-tbl td { padding: 1.2mm 2mm; border: 1px solid #ccc; vertical-align: middle; }
.pr-tbl td.pr-zh, .pr-tbl td.pr-pin { text-align: center; }
.pr-tbl td.pr-ar { text-align: right; }
.pr-tbl td.pr-en { text-align: left; }
.pr-tbl td.pr-n { width: 9mm; text-align: center; color: #888; font-size: 8pt; }
.pr-tbl th.pr-th-n { width: 9mm; }

/* ---------- real print: show only the print root ---------- */
@media print {

  #mc-print-root { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ===== bulk.css ===== */
/* ============================================================
   bulk.css — bulk entry screen (all classes prefixed bk-).
   Relies only on tokens / shared classes from base.css.
   ============================================================ */
.bk-modal .md-body { padding: 10px 14px; }
.bk-root { display: flex; flex-direction: column; gap: 12px; }

/* paste box */

.bk-cols { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.bk-col { flex: 0 0 auto; width: 150px; display: flex; flex-direction: column; gap: 4px; padding: 6px; background: var(--card); border: 1px solid var(--bd); border-radius: var(--r); }
.bk-colh { font-size: 11.5px; color: var(--dm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-msel { min-height: 32px; padding: 3px 8px; font-size: 13px; }

.bk-bar-in { height: 100%; width: 0; background: var(--gn); border-radius: 999px; transition: width .2s; }

/* stats + table */
.bk-stats { display: flex; gap: 6px; flex-wrap: wrap; }

.bk-c.bk-en { font-family: var(--fe); direction: ltr; color: var(--dm); font-size: 13.5px; }
.bk-ed { min-height: 30px; padding: 3px 6px; font-size: 14px; }

.bk-tbl .tag { white-space: nowrap; }
.bk-empty { padding: 18px 8px; text-align: center; }

/* footer */
.bk-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: 100%; }
.bk-foot .bk-close { margin-inline-start: auto; }

.bk-busy .bk-lock { pointer-events: none; opacity: .6; }

@media (max-width: 640px) {
  .bk-modal .md-body { padding: 8px 10px; }

  .bk-col { width: 130px; }
  .bk-tbl { min-width: 560px; }
  .bk-c-n { display: none; }
  .bk-foot .btn { flex: 1 1 auto; }

}

.bk-numrow { display: flex; align-items: center; gap: 6px; }

window.MC_GS = "/**\n * Mychinese backend — Google Apps Script bound to the data spreadsheet.\n *\n * Setup (once):\n *  1. Open the Google Sheet ▸ Extensions ▸ Apps Script ▸ paste this file as Code.gs ▸ Save.\n *  2. Deploy ▸ New deployment ▸ type \"Web app\" ▸ Execute as: Me ▸ Who has access: Anyone ▸ Deploy.\n *  3. Authorize when asked, copy the Web app URL (ends with /exec) into the app: ☰ البيانات ▸ Google Sheets.\n *  After editing this file later: Deploy ▸ Manage deployments ▸ ✎ ▸ Version: New version ▸ Deploy.\n *\n * The sheet keeps the Mychinese_Master_v3 structure: Items, Class1, Class2, Groups.\n * Only the DATA columns are written by the app; \"query\" columns (green headers: formulas) are never overwritten —\n * for new rows their formulas are copied from row 2.\n *\n * Endpoints\n *   GET  ?action=ping\n *   GET  ?action=load[&callback=fn]   -> {ok, rev, sheets:{Items:{rows:[[header...],[...]]}, Class1.., Class2.., Groups..}}\n *   POST (text/plain JSON body) {action:'sync', baseRev, ops:{Items:{upsert:[{id,..}], remove:[id..]}, Class1:{..}, Class2:{..}}}\n */\nvar MC_VERSION = 1;\nvar MC_SHEETS = {\n  Items:  { key: 'id',    data: ['id', 'c2', 'item_sort', 'ar', 'en', 'zh', 'pin'] },\n  Class1: { key: 'c1',    data: ['c1', 'group', 'c1_sort', 'level', 'c1_name', 'link'] },\n  Class2: { key: 'c2',    data: ['c2', 'c1', 'c2_sort', 'c2_name'] },\n  Groups: { key: 'group', data: null } // read-only\n};\n\n/* ---------------- HTTP entry points ---------------- */\nfunction doGet(e) {\n  var p = (e && e.parameter) || {};\n  try {\n    if (p.action === 'ping') return mcOut_({ ok: true, version: MC_VERSION, sheets: Object.keys(MC_SHEETS) }, p.callback);\n    if (p.action === 'load' || !p.action) return mcOut_(mcLoadAll_(SpreadsheetApp.getActiveSpreadsheet(), true), p.callback);\n    return mcOut_({ ok: false, error: 'unknown action' }, p.callback);\n  } catch (err) { return mcOut_({ ok: false, error: String(err && err.message || err) }, p.callback); }\n}\nfunction doPost(e) {\n  try {\n    var body = JSON.parse((e && e.postData && e.postData.contents) || '{}');\n    if (body.action === 'sync') return mcOut_(mcSync_(body));\n    if (body.action === 'init') return mcOut_(mcInit_(body));\n    return mcOut_({ ok: false, error: 'unknown action' });\n  } catch (err) { return mcOut_({ ok: false, error: String(err && err.message || err) }); }\n}\nfunction mcOut_(obj, callback) {\n  var json = JSON.stringify(obj);\n  if (callback && /^[A-Za-z_$][A-Za-z0-9_$.]*$/.test(callback)) {\n    return ContentService.createTextOutput(callback + '(' + json + ')').setMimeType(ContentService.MimeType.JAVASCRIPT);\n  }\n  return ContentService.createTextOutput(json).setMimeType(ContentService.MimeType.JSON);\n}\n\n/* ---------------- reading ---------------- */\nfunction mcCell_(v) {\n  if (v === null || v === undefined) return '';\n  if (Object.prototype.toString.call(v) === '[object Date]') return v.toISOString();\n  return v;\n}\n// allowMissing: for `load` — a spreadsheet without the 4 sheets (brand new) is reported as {empty:true} instead of an error.\nfunction mcLoadAll_(ss, allowMissing) {\n  var sheets = {}; var missing = [];\n  Object.keys(MC_SHEETS).forEach(function (name) {\n    var sh = ss.getSheetByName(name);\n    if (!sh) { if (allowMissing) { missing.push(name); return; } throw new Error('الورقة غير موجودة: ' + name); }\n    var vals = sh.getDataRange().getValues().map(function (r) { return r.map(mcCell_); });\n    sheets[name] = { rows: vals };\n  });\n  if (missing.length) return { ok: true, version: MC_VERSION, empty: true, missing: missing, rev: '', sheets: {} };\n  return { ok: true, version: MC_VERSION, rev: mcRev_(sheets), sheets: sheets };\n}\n// Revision = MD5 of all values (any change in the sheet, even manual, changes it).\nfunction mcRev_(sheets) {\n  var bytes = Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, JSON.stringify(sheets), Utilities.Charset.UTF_8);\n  return bytes.map(function (b) { b = (b < 0 ? b + 256 : b).toString(16); return b.length < 2 ? '0' + b : b; }).join('');\n}\n\n/* ---------------- pure logic (no Spreadsheet calls; unit-tested) ---------------- */\nfunction mcKey_(v) { return String(v === null || v === undefined ? '' : (typeof v === 'number' ? v : String(v).trim())); }\nfunction mcEmptyRow_(r) { return r.every(function (c) { return c === '' || c === null || c === undefined; }); }\n/**\n * vals: 2D array incl. header row. ops: {upsert:[objects], remove:[keys]}.\n * Returns {rows (no header), added, updated, removed}. Only columns named in spec.data are touched.\n */\nfunction mcApply_(vals, spec, ops) {\n  var header = vals[0].map(function (h) { return String(h).trim(); });\n  var ki = header.indexOf(spec.key);\n  if (ki < 0) throw new Error('العمود ' + spec.key + ' غير موجود');\n  spec.data.forEach(function (h) { if (header.indexOf(h) < 0) throw new Error('العمود ' + h + ' غير موجود'); });\n  var rows = vals.slice(1).filter(function (r) { return !mcEmptyRow_(r); }).map(function (r) { return r.slice(); });\n  var index = {}; rows.forEach(function (r, i) { index[mcKey_(r[ki])] = i; });\n  var res = { added: 0, updated: 0, removed: 0 };\n  var rm = {}; ((ops && ops.remove) || []).forEach(function (k) { rm[mcKey_(k)] = 1; });\n  ((ops && ops.upsert) || []).forEach(function (o) {\n    var k = mcKey_(o[spec.key]); if (!k) throw new Error('صف بلا مفتاح');\n    var i = index[k];\n    if (i === undefined) {\n      var row = header.map(function () { return ''; });\n      spec.data.forEach(function (h) { row[header.indexOf(h)] = o[h] === undefined || o[h] === null ? '' : o[h]; });\n      rows.push(row); index[k] = rows.length - 1; res.added++;\n    } else {\n      spec.data.forEach(function (h) { if (o[h] !== undefined) rows[i][header.indexOf(h)] = o[h] === null ? '' : o[h]; });\n      res.updated++;\n    }\n  });\n  if (Object.keys(rm).length) {\n    var before = rows.length; rows = rows.filter(function (r) { return !rm[mcKey_(r[ki])]; }); res.removed = before - rows.length;\n  }\n  res.rows = rows; return res;\n}\n\n/* ---------------- one-time initialisation of an EMPTY spreadsheet ---------------- */\n// Builds the four sheets with the Mychinese_Master_v3 layout (data columns + query formulas) from data posted by the app:\n// body = {action:'init', force?:bool, data:{groups:[..], class1:[..], class2:[..], items:[..]}}  (shapes as in the app: see src/core.js)\nfunction mcFormulas_(name, n) { // formulas for the query columns of rows 2..n+1\n  var f = []; var i, r;\n  for (i = 0; i < n; i++) {\n    r = i + 2;\n    if (name === 'Items') {\n      var q = function (col) { return '=INDEX(Class2!$' + col + ':$' + col + ',MATCH($B' + r + ',Class2!$A:$A,0))'; };\n      f.push([q('E'), q('B'), q('F'), q('G'), q('H'), q('C'), q('D'), '=INDEX(Groups!$D:$D,MATCH($H' + r + ',Groups!$A:$A,0))']);\n    } else { // Class2\n      var p = function (col) { return '=INDEX(Class1!$' + col + ':$' + col + ',MATCH($B' + r + ',Class1!$A:$A,0))'; };\n      f.push([p('B'), p('D'), p('C'), p('E')]);\n    }\n  }\n  return f;\n}\nvar MC_INIT_HEADERS = {\n  Items: ['id', 'c2', 'item_sort', 'ar', 'en', 'zh', 'pin', 'group', 'c1', 'level', 'c1_sort', 'c1_name', 'c2_sort', 'c2_name', 'group_ar'],\n  Class1: ['c1', 'group', 'c1_sort', 'level', 'c1_name', 'link'],\n  Class2: ['c2', 'c1', 'c2_sort', 'c2_name', 'group', 'level', 'c1_sort', 'c1_name'],\n  Groups: ['group', 'kind', 'scope', 'label_ar', 'label_en', 'group_sort']\n};\nfunction mcInitRows_(d) { // pure: data rows (data columns only) for each sheet\n  return {\n    Groups: d.groups.map(function (x) { return [x.group, x.kind, x.scope, x.label_ar, x.label_en, x.sort]; }),\n    Class1: d.class1.map(function (c) { return [c.c1, c.group, c.sort, c.level, c.name, c.link || '']; }),\n    Class2: d.class2.map(function (c) { return [c.c2, c.c1, c.sort, c.name]; }),\n    Items: d.items.map(function (i) { return [i.id, i.c2, i.sort, i.ar, i.en, i.zh, i.pin]; })\n  };\n}\nfunction mcInit_(body) {\n  var d = body.data; if (!d || !d.items || !d.class1 || !d.class2 || !d.groups) return { ok: false, error: 'بيانات التهيئة ناقصة' };\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var lock = LockService.getScriptLock(); lock.waitLock(25000);\n  try {\n    var existing = ss.getSheetByName('Items');\n    if (existing && existing.getLastRow() > 1 && !body.force) return { ok: false, error: 'not-empty', message: 'الشيت يحوي بيانات بالفعل (ورقة Items غير فارغة).' };\n    var rows = mcInitRows_(d); var made = {};\n    ['Groups', 'Class1', 'Class2', 'Items'].forEach(function (name) {\n      var sh = ss.getSheetByName(name) || ss.insertSheet(name); var hdr = MC_INIT_HEADERS[name]; var data = rows[name];\n      sh.clear();\n      sh.getRange(1, 1, 1, hdr.length).setValues([hdr]);\n      if (data.length) sh.getRange(2, 1, data.length, data[0].length).setValues(data);\n      if ((name === 'Items' || name === 'Class2') && data.length) { var fm = mcFormulas_(name, data.length); sh.getRange(2, data[0].length + 1, data.length, fm[0].length).setFormulas(fm); }\n      sh.setFrozenRows(1); sh.getRange(1, 1, 1, hdr.length).setFontWeight('bold'); sh.setRightToLeft(true);\n      made[name] = data.length;\n    });\n    // remove the default empty sheet(s) that came with a new spreadsheet\n    ss.getSheets().forEach(function (sh) { var n = sh.getName(); if (!MC_SHEETS[n] && sh.getLastRow() <= 1 && sh.getLastColumn() <= 1 && ss.getSheets().length > 4) ss.deleteSheet(sh); });\n    SpreadsheetApp.flush();\n    return { ok: true, rev: mcLoadAll_(ss).rev, created: made };\n  } finally { lock.releaseLock(); }\n}\n\n/* ---------------- writing ---------------- */\nfunction mcWriteTable_(sh, spec, ops) {\n  var vals = sh.getDataRange().getValues();\n  var header = vals[0].map(function (h) { return String(h).trim(); });\n  var oldN = vals.length - 1;\n  var res = mcApply_(vals, spec, ops);\n  var newN = res.rows.length;\n  if (newN > 0) {\n    spec.data.forEach(function (h) {\n      var j = header.indexOf(h);\n      sh.getRange(2, j + 1, newN, 1).setValues(res.rows.map(function (r) { return [r[j]]; }));\n    });\n  }\n  if (newN > oldN) { // new rows: copy the formulas of the non-data (query) columns from row 2\n    header.forEach(function (h, j) {\n      if (h === '' || spec.data.indexOf(h) >= 0) return;\n      sh.getRange(2, j + 1).copyTo(sh.getRange(oldN + 2, j + 1, newN - oldN, 1), SpreadsheetApp.CopyPasteType.PASTE_FORMULA, false);\n    });\n  } else if (newN < oldN) {\n    sh.deleteRows(newN + 2, oldN - newN);\n  }\n  return { added: res.added, updated: res.updated, removed: res.removed, rows: newN };\n}\nfunction mcSync_(body) {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var lock = LockService.getScriptLock(); lock.waitLock(25000);\n  try {\n    var cur = mcLoadAll_(ss);\n    if (body.baseRev && body.baseRev !== cur.rev) {\n      return { ok: false, error: 'conflict', message: 'تغيّرت البيانات في الشيت منذ آخر تحميل. حدّث من الشيت أولًا.', rev: cur.rev };\n    }\n    var summary = {};\n    // Order matters for readers of the sheet: classes first, then items.\n    ['Class1', 'Class2', 'Items'].forEach(function (name) {\n      var ops = body.ops && body.ops[name]; var spec = MC_SHEETS[name];\n      if (!ops || ((!ops.upsert || !ops.upsert.length) && (!ops.remove || !ops.remove.length))) return;\n      summary[name] = mcWriteTable_(ss.getSheetByName(name), spec, ops);\n    });\n    SpreadsheetApp.flush();\n    return { ok: true, rev: mcLoadAll_(ss).rev, summary: summary };\n  } finally { lock.releaseLock(); }\n}\n"; /* apps_script/Code.gs, for the "copy script" button */

<script>
/* ===== core.js ===== */
/* ============================================================
   core.js — data model, mutations, persistence, settings.
   No DOM access in this file (so it can be tested in Node).
   Everything is exposed on the global MC namespace.
   ============================================================ */
(function (g) {
  'use strict';
  const MC = (g.MC = g.MC || {});

  /* ---------- safe JSON storage (localStorage, falls back to memory) ---------- */
  const mem = {};
  let L = null;
  try { if (g.localStorage) { g.localStorage.setItem('__t', '1'); g.localStorage.removeItem('__t'); L = g.localStorage; } } catch (e) { L = null; }
  MC.store = {
    get(k, d) { try { const v = L ? L.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { const s = JSON.stringify(v); if (L) L.setItem(k, s); else mem[k] = s; return true; } catch (e) { return false; } },
    del(k) { try { if (L) L.removeItem(k); else delete mem[k]; } catch (e) { /* ignore */ } },
  };

  /* ---------- tiny event bus ---------- */
  const subs = {};
  MC.on = (ev, fn) => { (subs[ev] = subs[ev] || []).push(fn); return () => { subs[ev] = (subs[ev] || []).filter((f) => f !== fn); }; };
  MC.emit = (ev, p) => (subs[ev] || []).slice().forEach((f) => { try { f(p); } catch (e) { console.error(e); } });

  /* ---------- constants ---------- */
  // Display order of the four languages everywhere.
  MC.LANGS = [
    { key: 'zh', label: '中文' },
    { key: 'pin', label: 'بينيين' },
    { key: 'ar', label: 'عربي' },
    { key: 'en', label: 'English' },
  ];
  MC.GROUP_STYLE = {
    words_general: { color: '#2d6cdf', soft: '#e8f0fe' },
    words_specialized: { color: '#6d4ad8', soft: '#efeafd' },
    sentences_general: { color: '#e08a1e', soft: '#fdf1df' },
    sentences_specialized: { color: '#1f9d57', soft: '#e3f5ea' },
  };
  MC.groupStyle = (code) => MC.GROUP_STYLE[code] || { color: '#6b7280', soft: '#f1f2f6' };

  /* ---------- text helpers ---------- */
  // Search normalisation: lower-case, strip Arabic diacritics/tatweel, unify hamza/ya/ta-marbuta, strip pinyin tone marks.
  MC.norm = (s) => String(s == null ? '' : s)
    .normalize('NFD').replace(/[̀-ًͯ-ٰٟـ]/g, '').normalize('NFC')
    .toLowerCase().replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/\s+/g, ' ').trim();
  // Key used to detect duplicates: Chinese text without spaces/punctuation.
  MC.zhKey = (s) => String(s == null ? '' : s).replace(/[\s　]+/g, '').replace(/[\p{P}\p{S}]/gu, '').toLowerCase();

  /* ---------- data ---------- */
  MC.data = { groups: [], class1: [], class2: [], items: [] };
  MC.meta = { source: '', built: '', hash: '', working: false, baseChanged: false };
  let X = null; // lazily built index
  MC.invalidate = () => { X = null; };

  function byNum(a, b) { return a - b; }
  function build() {
    const d = MC.data;
    const x = { item: new Map(), c1: new Map(), c2: new Map(), grp: new Map(), c2Items: new Map(), c1C2: new Map(), grpC1: new Map(), blob: new Map() };
    d.groups.forEach((gr) => x.grp.set(gr.group, gr));
    d.class1.forEach((c) => x.c1.set(c.c1, c));
    d.class2.forEach((c) => x.c2.set(c.c2, c));
    d.items.forEach((i) => x.item.set(i.id, i));
    const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
    d.class1.forEach((c) => push(x.grpC1, c.group, c));
    d.class2.forEach((c) => push(x.c1C2, c.c1, c));
    d.items.forEach((i) => push(x.c2Items, i.c2, i));
    x.grpC1.forEach((a) => a.sort((p, q) => p.sort - q.sort || p.c1 - q.c1));
    x.c1C2.forEach((a) => a.sort((p, q) => p.sort - q.sort || p.c2 - q.c2));
    x.c2Items.forEach((a) => a.sort((p, q) => p.sort - q.sort || p.id - q.id));
    // display order: group -> c1 -> c2 -> item ; orphans last
    const groups = d.groups.slice().sort((p, q) => p.sort - q.sort);
    x.groupsSorted = groups;
    const ordered = [];
    const seen = new Set();
    groups.forEach((gr) => (x.grpC1.get(gr.group) || []).forEach((c1) => (x.c1C2.get(c1.c1) || []).forEach((c2) => (x.c2Items.get(c2.c2) || []).forEach((it) => { ordered.push(it); seen.add(it.id); }))));
    d.items.forEach((it) => { if (!seen.has(it.id)) ordered.push(it); });
    x.ordered = ordered;
    // duplicate map (by Chinese text)
    const dm = new Map();
    d.items.forEach((it) => { const k = MC.zhKey(it.zh); if (k) push(dm, k, it.id); });
    x.dup = new Map(); x.dupGroups = [];
    dm.forEach((ids) => { if (ids.length > 1) { ids.forEach((id) => x.dup.set(id, ids)); x.dupGroups.push(ids); } });
    return x;
  }
  const ix = () => X || (X = build());

  MC.getItem = (id) => ix().item.get(+id) || null;
  MC.getClass1 = (c1) => ix().c1.get(+c1) || null;
  MC.getClass2 = (c2) => ix().c2.get(+c2) || null;
  MC.getGroup = (code) => ix().grp.get(code) || null;
  MC.groupsSorted = () => ix().groupsSorted.slice();
  MC.class1Of = (group) => (ix().grpC1.get(group) || []).slice();   // sorted
  MC.class2Of = (c1) => (ix().c1C2.get(+c1) || []).slice();         // sorted
  MC.itemsOf = (c2) => (ix().c2Items.get(+c2) || []).slice();       // sorted
  MC.dupIds = (id) => ix().dup.get(+id) || null;                    // all ids sharing the same Chinese text (or null)
  MC.dupGroups = () => ix().dupGroups.slice();

  // Denormalised, read-only "view" of an item. This is what UI/print/quiz modules should consume.
  MC.view = (it) => {
    const c2 = ix().c2.get(it.c2) || {}; const c1 = ix().c1.get(c2.c1) || {}; const gr = ix().grp.get(c1.group) || {};
    return {
      id: it.id, c2: it.c2, sort: it.sort, ar: it.ar || '', en: it.en || '', zh: it.zh || '', pin: it.pin || '',
      c2name: c2.name || '', c1: c1.c1 == null ? null : c1.c1, c1name: c1.name || '', level: c1.level == null ? null : c1.level, link: c1.link || '',
      group: c1.group || '', groupLabel: gr.label_ar || c1.group || '', kind: gr.kind || '', scope: gr.scope || '',
    };
  };

  function blobOf(it) {
    const b = ix().blob; let s = b.get(it.id);
    if (s == null) { s = MC.norm([it.zh, it.pin, it.ar, it.en].join(' | ')); b.set(it.id, s); }
    return s;
  }

  /* ---------- hidden items (stored in this browser only; not part of the sheet) ---------- */
  const HKEY = 'mc.hidden.v1';
  const hidden = new Set((MC.store.get(HKEY, []) || []).map(Number));
  const saveHidden = () => { MC.store.set(HKEY, Array.from(hidden)); MC.emit('hidden'); };
  MC.isHidden = (id) => hidden.has(+id);
  MC.hiddenIds = () => Array.from(hidden).filter((id) => ix().item.has(id));
  MC.hiddenCount = () => MC.hiddenIds().length;
  MC.setHidden = (ids, flag) => { ids.forEach((id) => { if (flag) hidden.add(+id); else hidden.delete(+id); }); saveHidden(); };
  MC.clearHidden = () => { hidden.clear(); saveHidden(); };

  /* Query items (returns views in display order).
     f = { group:'code'|[codes], kind:'word'|'sentence', scope:'general'|'specialized', c1:n, c2:n, q:'text', ids:[...], dupOnly:bool,
           hidden:'exclude'|'only'|'all' }   hidden defaults to 'exclude' (items the user hid are not returned), or 'all' when `ids` is given. */
  MC.query = (f) => {
    f = f || {};
    let list = ix().ordered;
    const hm = f.hidden || (f.ids ? 'all' : 'exclude');
    const grp = f.group && f.group !== 'all' ? (Array.isArray(f.group) ? f.group : [f.group]) : null;
    const idSet = f.ids ? new Set(f.ids.map(Number)) : null;
    const toks = f.q ? MC.norm(f.q).split(' ').filter(Boolean) : null;
    const out = [];
    for (const it of list) {
      if (idSet && !idSet.has(it.id)) continue;
      if (hm !== 'all') { const ih = hidden.has(it.id); if (hm === 'exclude' ? ih : !ih) continue; }
      if (f.c2 != null && f.c2 !== '' && it.c2 !== +f.c2) continue;
      if (f.dupOnly && !ix().dup.has(it.id)) continue;
      if (toks) { const b = blobOf(it); let ok = true; for (const t of toks) { if (b.indexOf(t) < 0) { ok = false; break; } } if (!ok) continue; }
      const v = MC.view(it);
      if (grp && grp.indexOf(v.group) < 0) continue;
      if (f.kind && v.kind !== f.kind) continue;
      if (f.scope && v.scope !== f.scope) continue;
      if (f.c1 != null && f.c1 !== '' && v.c1 !== +f.c1) continue;
      out.push(v);
    }
    return out;
  };
  MC.count = (f) => MC.query(f).length;

  /* ---------- mutations ---------- */
  let batchDepth = 0; let batchDirty = false;
  function changed() {
    MC.invalidate();
    if (batchDepth) { batchDirty = true; return; }
    MC.save(); MC.emit('data');
  }
  MC.batch = (fn) => { batchDepth++; try { return fn(); } finally { batchDepth--; if (!batchDepth && batchDirty) { batchDirty = false; changed(); } } };

  const maxOf = (arr, key) => arr.reduce((m, x) => Math.max(m, +x[key] || 0), 0);
  // Ids are never re-used, even after deleting the highest one (scores in the browser are keyed by item id).
  function nextId(kind, arr, key) {
    const s = MC.data.seq = MC.data.seq || {};
    const v = Math.max(s[kind] || 0, maxOf(arr, key)) + 1; s[kind] = v; return v;
  }
  function renumberItems(c2) { MC.data.items.filter((i) => i.c2 === c2).sort((a, b) => a.sort - b.sort || a.id - b.id).forEach((i, k) => { i.sort = k + 1; }); }
  function renumberC1(group) { MC.data.class1.filter((c) => c.group === group).sort((a, b) => a.sort - b.sort || a.c1 - b.c1).forEach((c, k) => { c.sort = k + 1; }); }
  function renumberC2(c1) { MC.data.class2.filter((c) => c.c1 === c1).sort((a, b) => a.sort - b.sort || a.c2 - b.c2).forEach((c, k) => { c.sort = k + 1; }); }
  const cleanText = (s) => String(s == null ? '' : s).replace(/\s+$/g, '').replace(/^\s+/g, '');

  // Insert at 1-based position (default: end of its c2). Returns the new item.
  MC.addItem = (f, opts) => {
    opts = opts || {};
    if (!MC.getClass2(f.c2)) throw new Error('c2 غير موجود');
    const n = MC.data.items.filter((i) => i.c2 === +f.c2).length;
    const pos = opts.position ? Math.max(1, Math.min(n + 1, +opts.position)) : n + 1;
    const it = { id: nextId('item', MC.data.items, 'id'), c2: +f.c2, sort: pos - 0.5, ar: cleanText(f.ar), en: cleanText(f.en), zh: cleanText(f.zh), pin: cleanText(f.pin) };
    MC.data.items.push(it); renumberItems(it.c2); changed();
    return it;
  };
  // Bulk add: list of {c2,ar,en,zh,pin}; all appended to the end of their c2. One save/emit.
  MC.addItems = (list) => MC.batch(() => list.map((f) => MC.addItem(f)));
  // patch may contain ar,en,zh,pin,c2. If c2 changes the item goes to the end of the new c2 (or opts.position).
  MC.updateItem = (id, patch, opts) => {
    opts = opts || {};
    const it = MC.getItem(id); if (!it) return null;
    ['ar', 'en', 'zh', 'pin'].forEach((k) => { if (k in patch) it[k] = cleanText(patch[k]); });
    if ('c2' in patch && +patch.c2 !== it.c2) {
      if (!MC.getClass2(patch.c2)) throw new Error('c2 غير موجود');
      const old = it.c2; const n = MC.data.items.filter((i) => i.c2 === +patch.c2).length;
      it.c2 = +patch.c2; it.sort = opts.position ? Math.max(1, Math.min(n + 1, +opts.position)) - 0.5 : n + 1;
      renumberItems(old); renumberItems(it.c2);
    } else if (opts.position) {
      const n = MC.data.items.filter((i) => i.c2 === it.c2).length; it.sort = Math.max(1, Math.min(n, +opts.position)) + (opts.position > it.sort ? 0.5 : -0.5); renumberItems(it.c2);
    }
    changed(); return it;

  function langSpan(lang, text, cls) {
    return h('span', { class: 't-' + lang + (cls ? ' ' + cls : ''), dir: dirOf(lang), text: String(text == null ? '' : text) });
  }
  function speakBtn(text, cls) {
    if (!canSpeak() || !text) return null;
    return h('button', { class: 'btn sm ico qz-spk' + (cls ? ' ' + cls : ''), type: 'button', title: 'نطق', 'aria-label': 'نطق', text: '🔊', onclick: (e) => { e.stopPropagation(); MC.speak(text); } });
  }
  function scoreBadge(s, none) {
    if (none) return h('span', { class: 'qz-rs qz-s-none', text: '—' });
    return h('span', { class: 'qz-rs qz-s-' + levelOf(s), text: fmt(s) });
  }
  const chip = (label, on, onclick, extra) => h('button', { class: 'chip qz-chip' + (on ? ' on' : '') + (extra ? ' ' + extra : ''), type: 'button', onclick }, label);

  function defaultCfg(rows) {
    const sent = rows.filter((r) => r.kind === 'sentence').length > rows.length / 2;
    const sv = (qLoad().setup) || {};
    const typesSaved = sent ? sv.typesSentence : sv.typesWord;
    const cfg = {
      q: ['zh'], a: 'ar', types: sent ? ['mc', 'tf'] : ['write', 'mc', 'tf'], count: 10, mode: 'random', noTones: false,
    };
    if (sv.a && LANG_KEYS.indexOf(sv.a) >= 0) cfg.a = sv.a;
    if (Array.isArray(sv.q) && sv.q.length) cfg.q = sv.q;
    if (Array.isArray(typesSaved)) cfg.types = typesSaved;
    if (sv.count != null) cfg.count = sv.count;
    if (MODES.indexOf(sv.mode) >= 0) cfg.mode = sv.mode;
    if (sv.noTones) cfg.noTones = true;
    const out = _normCfg(cfg); delete out.rng; out.sentenceSet = sent;
    return out;
  }
  function saveSetup(cfg) {
    const q = qLoad(); const sv = q.setup = q.setup || {};
    sv.q = cfg.q.slice(); sv.a = cfg.a; sv.count = cfg.count; sv.mode = cfg.mode; sv.noTones = !!cfg.noTones;
    if (cfg.sentenceSet) sv.typesSentence = cfg.types.slice(); else sv.typesWord = cfg.types.slice();
    qSave();
  }

  /* ------------------------------------------------------------------
     MC.Quiz.open(rows, opts)
     ------------------------------------------------------------------ */
  function open(rows, opts) {
    opts = opts || {};
    rows = (rows || []).filter(Boolean);
    if (!rows.length) { MC.toast('لا توجد عناصر للاختبار', 'err'); return null; }
    const ui = { rows, cfg: defaultCfg(rows), phase: 'setup', session: null, scoreOpen: false, reviewing: false };
    const m = MC.modal.open({
      title: opts.title || 'اختبار', body: h('div', { class: 'qz-root' }), footer: [], className: 'qz-modal', width: '720px', persistent: true,
      onClose: () => {
        g.document.removeEventListener('keydown', onKey);
        const s = ui.session;
        if (s && !s.saved && s.qs.some((q) => q.done && q.outcome !== 'skip')) { const n = saveSession(); MC.toast('حُفظت درجات ' + n + ' سؤال', 'ok'); }
      },
    });
    g.document.addEventListener('keydown', onKey);

    const cur = () => ui.session && ui.session.qs[ui.session.i];
    function footerSet(btns) {
      clear(m.footer);
      btns.filter(Boolean).forEach((b) => m.footer.appendChild(h('button', { class: 'btn ' + (b.cls || ''), type: 'button', disabled: !!b.disabled, onclick: b.onClick }, b.label)));
    }

    /* ---------- score saving ---------- */
    function saveSession() {
      const s = ui.session; if (!s || s.saved) return 0;
      s.saved = true;
      const pairs = _aggregate(s.qs);
      if (pairs.length) MC.Scores.applyDeltas(pairs);
      s.after = {}; pairs.forEach((p) => { s.after[p[0]] = MC.Scores.get(p[0]); });
      return pairs.length;
    }

    /* ---------- session control ---------- */
    function allViews() { return ui.all || (ui.all = MC.query({})); } // distractor pool = the whole dictionary
    function startSession(srcRows, cfg) {
      cfg = Object.assign({}, cfg, { pool: allViews() });
      const res = _makeQuestions(srcRows, cfg);
      if (!res.questions.length) {
        let msg = 'تعذّر إنشاء أسئلة بالإعدادات المختارة';
        if (!res.eligible) msg = 'لا توجد عناصر فيها نص في لغة الإجابة ولغة السؤال المختارتين';
        else if (cfg.mode === 'untested') msg = 'كل العناصر سبق اختبارها — اختر نمطًا آخر';
        else if (cfg.types.length === 1 && cfg.types[0] === 'mc') msg = 'الاختيار من متعدد يحتاج 4 خيارات مختلفة على الأقل';
        MC.toast(msg, 'err'); return false;
      }
      if (res.dropped.length) MC.toast('تعذّر إنشاء سؤال لـ ' + res.dropped.length + ' عنصر وتم تجاهلها');
      ui.session = { cfg, st: MC.Scores.settings(), qs: res.questions, i: 0, saved: false };
      ui.phase = 'run'; ui.reviewing = false; renderRun(); return true;
    }
    function answer(resp, dk) {
      const q = cur(); if (!q || q.done) return;
      const s = ui.session; q.resp = resp; q.done = true;
      q.outcome = dk ? 'dk' : (_grade(q, resp, s.cfg) ? 'ok' : 'bad');
      q.delta = _deltaFor(q.type, q.outcome, q.hint, s.st);
      renderRun();
    }
    function skip() { const q = cur(); if (!q || q.done) return; q.done = true; q.outcome = 'skip'; q.delta = 0; next(); }
    function next() { const s = ui.session; if (s.i < s.qs.length - 1) { s.i++; renderRun(); } else finish(); }
    function finish() { saveSession(); ui.phase = 'result'; renderResult(); }
    function quit() {
      const n = ui.session.qs.filter((q) => q.done && q.outcome !== 'skip').length;
      MC.confirm(n ? 'إنهاء الاختبار الآن؟\nستُحفظ درجات ' + n + ' سؤال أجبت عنها.' : 'إنهاء الاختبار؟ لم تجب عن أي سؤال بعد.', { title: 'إنهاء الاختبار' }).then((ok) => {
        if (!ok) return; if (n) finish(); else m.close();
      });
    }
    function submitWrite() {
      const q = cur(); if (!q || q.done) return;
      const v = String(q.input || '').trim();
      if (!v) { MC.toast('اكتب إجابتك أولاً أو اضغط «لا أعرف»', 'err'); return; }
      answer(v);
    }

    /* ---------- keyboard ---------- */
    function onKey(e) {
      if (MC.modal.top() !== m || ui.phase !== 'run' || e.ctrlKey || e.metaKey || e.altKey) return;
      const q = cur(); if (!q) return;
      const tag = e.target && e.target.tagName;
      if (q.done) { if (e.key === 'Enter' && tag !== 'BUTTON' && !e.repeat) { e.preventDefault(); next(); } return; }
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (q.type === 'mc' && /^[1-9]$/.test(e.key) && +e.key <= q.opts.length) { e.preventDefault(); answer(+e.key - 1); }
      else if (q.type === 'tf' && (e.key === '1' || e.key === '2')) { e.preventDefault(); answer(e.key === '1'); }
      else if (e.key === '0') { e.preventDefault(); answer(null, true); }
    }

    /* ---------- setup screen ---------- */
    function renderSetup() {
      const cfg = ui.cfg; ui.phase = 'setup';
      m.setTitle(opts.title || 'اختبار');
      const body = m.body; clear(body);
      const c = _normCfg(cfg);
      const elig = rows.filter((it) => _eligible(it, c));
      const untested = elig.filter((it) => !MC.Scores.info(it.id)).length;
      const avail = cfg.mode === 'untested' ? untested : elig.length;
      const nq = cfg.count > 0 ? Math.min(cfg.count, avail) : avail;
      const nSent = rows.filter((r) => r.kind === 'sentence').length;

      const sec = (label, content, extra) => h('div', { class: 'qz-sec' }, h('div', { class: 'qz-lab' }, label, extra || null), content);

      // question languages (multi)
      const qChips = MC.LANGS.map((l) => {
        const isA = l.key === cfg.a; const on = cfg.q.indexOf(l.key) >= 0 && !isA;
        return chip((on ? '☑ ' : '☐ ') + l.label + (isA ? ' (= الإجابة)' : ''), on, () => {
          if (isA) return;
          if (on) { if (cfg.q.length === 1) { MC.toast('يجب اختيار لغة سؤال واحدة على الأقل', 'err'); return; } cfg.q = cfg.q.filter((k) => k !== l.key); } else cfg.q = cfg.q.concat([l.key]);
          renderSetup();
        }, isA ? 'dis' : '');
      });
      const aChips = MC.LANGS.map((l) => chip((cfg.a === l.key ? '◉ ' : '○ ') + l.label, cfg.a === l.key, () => {
        cfg.a = l.key; cfg.q = cfg.q.filter((k) => k !== l.key);
        if (!cfg.q.length) cfg.q = [l.key === 'zh' ? 'ar' : 'zh'];
        renderSetup();
      }));
      const tChips = TYPES.map((t) => chip((cfg.types.indexOf(t) >= 0 ? '☑ ' : '☐ ') + TYPE_LABEL[t], cfg.types.indexOf(t) >= 0, () => {
        cfg.types = cfg.types.indexOf(t) >= 0 ? cfg.types.filter((x) => x !== t) : cfg.types.concat([t]); renderSetup();
      }));
      const nChips = [10, 20, 50, 0].map((n) => chip(n === 0 ? 'الكل' : String(n), cfg.count === n, () => { cfg.count = n; renderSetup(); }));
      const mChips = MODES.map((k) => chip(MODE_LABEL[k] + (k === 'untested' ? ' (' + untested + ')' : ''), cfg.mode === k, () => { cfg.mode = k; renderSetup(); }));

      body.appendChild(h('div', { class: 'qz-sum' }, h('b', { text: String(rows.length) }), ' عنصرًا مُحددًا',
        nSent ? h('span', { class: 'qz-dim', text: ' (' + (rows.length - nSent) + ' كلمة، ' + nSent + ' جملة)' }) : null));
      body.appendChild(sec('❓ لغة السؤال', h('div', { class: 'qz-chips' }, qChips), h('span', { class: 'qz-dim', text: 'يمكن اختيار أكثر من لغة' })));
      body.appendChild(sec('✍️ لغة الإجابة', h('div', { class: 'qz-chips' }, aChips)));
      body.appendChild(sec('🧩 أنواع الأسئلة', h('div', { class: 'qz-chips' }, tChips)));
      body.appendChild(sec('🔢 عدد الأسئلة', h('div', { class: 'qz-chips' }, nChips)));
      body.appendChild(sec('📚 اختيار العناصر', h('div', { class: 'qz-chips' }, mChips)));

      if (cfg.a === 'pin' && cfg.types.indexOf('write') >= 0) {
        body.appendChild(h('label', { class: 'chk qz-chk' },
          h('input', { type: 'checkbox', checked: cfg.noTones ? true : null, onchange: (e) => { cfg.noTones = e.target.checked; } }),
          'تجاهل النغمات عند كتابة البينيين (yi zi بدل yǐ zi)'));
      }
      // notes
      const notes = [];
      if (nq > 0) notes.push(['ok', 'سيُطرح ' + nq + ' سؤالاً من ' + avail + ' عنصرًا صالحًا.']);
      else notes.push(['warn', cfg.mode === 'untested' && elig.length ? 'كل العناصر المحددة سبق اختبارها.' : 'لا توجد عناصر صالحة: تأكد أن العناصر فيها نص بلغة الإجابة وبلغة السؤال.']);
      if (!cfg.types.length) notes.push(['warn', 'اختر نوع سؤال واحدًا على الأقل.']);
      if (cfg.types.indexOf('mc') >= 0 && allViews().filter((x) => txt(x, cfg.a)).length < 4) notes.push(['warn', 'الاختيار من متعدد يحتاج 4 عناصر مختلفة على الأقل.']);
      if (nSent > rows.length / 2 && cfg.types.indexOf('write') >= 0) notes.push(['', 'الجمل طويلة: الكتابة تتجاهل علامات الترقيم والمسافات وحالة الأحرف، لكن يُفضَّل الاختيار وصح/خطأ.']);
      if (cfg.types.indexOf('write') >= 0 && cfg.a === 'pin') notes.push(['', 'اكتب البينيين بالعلامات (yǐ zi) أو بالأرقام (yi3 zi0) — المسافات اختيارية، ويُقبل حذف صفر النغمة الخفيفة.']);
      if (cfg.types.indexOf('write') >= 0 && cfg.a === 'zh') notes.push(['', 'كتابة الحروف الصينية تحتاج لوحة مفاتيح صينية (Pinyin IME) مفعّلة على جهازك.']);
      notes.forEach((n) => body.appendChild(h('div', { class: 'qz-note' + (n[0] === 'warn' ? ' warn' : n[0] === 'ok' ? ' ok' : ''), text: n[1] })));

      body.appendChild(scoringBox());

      footerSet([
        { label: '▶ ابدأ الاختبار', cls: 'pri', disabled: !(nq > 0 && cfg.types.length), onClick: () => { saveSetup(cfg); startSession(rows, Object.assign({}, cfg)); } },
        { label: '📊 الإحصائيات', onClick: () => openStats(rows) },
        { label: 'إلغاء', cls: 'ghost', onClick: () => m.close() },
      ]);
    }

    function scoringBox() {
      const st = MC.Scores.settings();
      const det = h('details', { class: 'qz-det' });
      if (ui.scoreOpen) det.open = true;
      det.addEventListener('toggle', () => { ui.scoreOpen = det.open; });
      const inputs = {};
      const save = () => {
        const o = {}; NUM_KEYS.forEach((k) => { o[k] = num(inputs[k].value, DEF_SETTINGS[k]); });
        o.clamp = chk.checked; MC.Scores.setSettings(o); lims.hidden = !chk.checked;
      };
      const mk = (key) => { const i = h('input', { class: 'inp qz-num', type: 'number', step: '1', value: String(st[key]) }); i.addEventListener('change', save); inputs[key] = i; return i; };
      const row = (label, t) => h('tr', null, h('td', { class: 'qz-tl', text: label }), h('td', null, mk(t + '_ok')), h('td', null, mk(t + '_bad')), h('td', null, mk(t + '_dk')));
      const chk = h('input', { type: 'checkbox', checked: st.clamp ? true : null }); chk.addEventListener('change', save);
      const lims = h('div', { class: 'qz-lims', hidden: !st.clamp }, 'من ', mk('smin'), ' إلى ', mk('smax'));
      det.appendChild(h('summary', { text: '⚙️ إعدادات الدرجات' }));
      det.appendChild(h('div', { class: 'qz-det-b' },
        h('div', { class: 'qz-scroll-x' }, h('table', { class: 'qz-tbl' },
          h('thead', null, h('tr', null, h('th', { text: 'نوع السؤال' }), h('th', { class: 'qz-good', text: '✓ صحيحة' }), h('th', { class: 'qz-badc', text: '✗ خاطئة' }), h('th', { text: '🤷 لا أعرف' }))),
          h('tbody', null, row('⌨️ كتابة', 'write'), row('🔘 اختيار', 'mc'), row('⚖️ صح/خطأ', 'tf')))),
        h('div', { class: 'qz-dim', text: 'إظهار البينيين (تلميح) ينقص 1 من درجة الإجابة الصحيحة. التخطّي لا يغيّر الدرجة.' }),
        h('label', { class: 'chk qz-chk' }, chk, 'تفعيل حدود الدرجات'), lims,
        h('div', { class: 'qz-det-f' }, h('button', { class: 'btn sm', type: 'button', text: '↩ الافتراضي', onclick: () => { MC.Scores.resetSettings(); ui.scoreOpen = true; renderSetup(); } }))));
      return det;
    }

    /* ---------- run screen ---------- */
    function renderRun() {
      const s = ui.session; const q = s.qs[s.i]; const n = s.qs.length;
      const sum = _summarize(s.qs);
      const body = m.body; clear(body);
      body.appendChild(h('div', { class: 'qz-top' },
        h('span', { class: 'qz-cnt', dir: 'ltr', text: (s.i + 1) + ' / ' + n }),
        h('span', { class: 'qz-c-ok', text: '✓ ' + sum.ok }),
        h('span', { class: 'qz-c-bad', text: '✗ ' + (sum.bad + sum.dk) }),
        h('span', { class: 'qz-sp' }),
        h('button', { class: 'btn sm ghost', type: 'button', text: 'إنهاء', onclick: quit })));
      body.appendChild(h('div', { class: 'qz-bar' }, h('i', { style: { width: Math.round((s.i + (q.done ? 1 : 0)) * 100 / n) + '%' } })));
      body.appendChild(h('div', { class: 'qz-dir', text: LANG_LABEL[q.q] + ' ← ' + LANG_LABEL[q.a] + ' · ' + TYPE_SHORT[q.type] }));

      const long = q.kind === 'sentence' || String(q.prompt).length > 12;
      const showSpk = q.done || q.q === 'zh' || (q.q === 'pin' && q.a !== 'zh');
      body.appendChild(h('div', { class: 'qz-prompt' + (long ? ' long' : '') }, langSpan(q.q, q.prompt), showSpk ? speakBtn(q.item.zh, 'qz-spk-p') : null));

      if (q.hintable && !q.done) {
        body.appendChild(q.hint
          ? h('div', { class: 'qz-hint', dir: 'ltr', text: q.item.pin })
          : h('div', { class: 'qz-hint' }, h('button', { class: 'btn sm', type: 'button', title: 'ينقص نقطة من الإجابة الصحيحة', text: '💡 إظهار البينيين (−1)', onclick: () => { q.hint = true; renderRun(); if (q.type === 'write') focusInput(); } })));
      }

      let writeIn = null;
      if (q.type === 'mc') {
        body.appendChild(h('div', { class: 'qz-ans' }, q.opts.map((o, i) => {
          let cls = ''; if (q.done) { if (o.correct) cls = ' ok'; else if (i === q.resp) cls = ' bad'; }
          return h('button', { class: 'qz-choice' + cls, type: 'button', disabled: q.done ? true : null, onclick: () => answer(i) }, h('span', { class: 'qz-k', text: String(i + 1) }), langSpan(q.a, o.text));
        })));
      } else if (q.type === 'tf') {
        body.appendChild(h('div', { class: 'qz-tfq', text: 'هل هذه هي الترجمة / الصيغة الصحيحة؟' }));
        body.appendChild(h('div', { class: 'qz-stmt' + (q.shown.length > 14 ? ' long' : '') }, langSpan(q.a, q.shown), q.a === 'zh' ? speakBtn(q.shown, 'qz-spk-p') : null));
        body.appendChild(h('div', { class: 'qz-ans qz-tf' }, [[true, '✓ صح', '1'], [false, '✗ خطأ', '2']].map((x) => {
          let cls = ''; if (q.done) { if (x[0] === q.truth) cls = ' ok'; else if (x[0] === q.resp) cls = ' bad'; }
          return h('button', { class: 'qz-choice' + cls, type: 'button', disabled: q.done ? true : null, onclick: () => answer(x[0]) }, h('span', { class: 'qz-k', text: x[2] }), x[1]);
        })));
      } else {
        const pv = q.a === 'pin' ? h('div', { class: 'qz-pv', dir: 'ltr', text: pyMark(q.input) }) : null;
        writeIn = h('input', {
          class: 'qz-in', type: 'text', dir: dirOf(q.a), autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false',
          placeholder: q.a === 'pin' ? 'مثال: yǐ zi أو yi3 zi0' : 'اكتب الإجابة ثم Enter', value: q.input || '', disabled: q.done ? true : null,
        });
        writeIn.id = 'qz-write';
        writeIn.addEventListener('input', () => { q.input = writeIn.value; if (pv) pv.textContent = pyMark(writeIn.value); });
        writeIn.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); e.stopPropagation(); submitWrite(); } });
        body.appendChild(writeIn); if (pv) body.appendChild(pv);
      }

      if (q.done) body.appendChild(feedback(q, s));

      if (!q.done) {
        footerSet([
          q.type === 'write' ? { label: '✔ تحقق (Enter)', cls: 'pri', onClick: submitWrite } : null,
          { label: '🤷 لا أعرف', onClick: () => answer(null, true) },
          { label: 'تخطّي', cls: 'ghost', onClick: skip },
        ]);
        if (q.type === 'write') focusInput(); else if (g.document.activeElement && g.document.activeElement.blur) g.document.activeElement.blur();
      } else {
        footerSet([{ label: s.i < n - 1 ? 'التالي ← (Enter)' : '🏁 عرض النتيجة (Enter)', cls: 'pri', onClick: next }]);
      }
    }
    function focusInput() { setTimeout(() => { const el = m.body.querySelector('#qz-write'); if (el && !el.disabled) { el.focus(); const l = el.value.length; try { el.setSelectionRange(l, l); } catch (e) { /* ignore */ } } }, 30); }

    function allLangsLine(it, withSpeak) {
      const parts = [];
      MC.LANGS.forEach((l) => { if (txt(it, l.key)) parts.push(langSpan(l.key, it[l.key], 'qz-wl')); });
      return h('div', { class: 'qz-word' }, parts, withSpeak ? speakBtn(it.zh) : null);
    }
    function feedback(q, s) {
      const ok = q.outcome === 'ok'; const after = (() => { let v = q.base + q.delta; if (s.st.clamp) v = Math.max(s.st.smin, Math.min(s.st.smax, v)); return round2(v); })();
      const head = h('div', { class: 'qz-fb-h' },
        h('b', { text: ok ? '✅ إجابة صحيحة' : q.outcome === 'dk' ? '🤷 لا أعرف' : '❌ إجابة خاطئة' }),
        h('b', { class: 'qz-delta', dir: 'ltr', text: fmt(q.delta) }),
        h('span', { class: 'qz-dim', text: '(الدرجة: ' + fmt(q.base) + ' ← ' + fmt(after) + ')' }));
      const ans = (!ok || q.type === 'write') ? h('div', { class: 'qz-right' }, 'الإجابة الصحيحة: ', langSpan(q.a, q.right, 'qz-b'),
        q.a === 'pin' ? h('span', { class: 'qz-dim', dir: 'ltr', text: ' (' + pyNum(q.right) + ')' }) : null) : null;
      const typed = q.type === 'write' && !ok && q.outcome === 'bad' && q.input ? h('div', { class: 'qz-typed' }, 'كتبت: ', h('span', { dir: 'auto', text: q.input })) : null;
      return h('div', { class: 'qz-fb ' + (ok ? 'ok' : q.outcome === 'dk' ? 'dk' : 'bad') }, head, ans, typed, allLangsLine(q.item, true));
    }

    /* ---------- result + review ---------- */
    function renderResult() {
      const s = ui.session; const sum = _summarize(s.qs);
      m.setTitle('🏁 نتيجة الاختبار');
      const body = m.body; clear(body);

      h('button', { class: 'btn', onclick: () => { S.views.forEach((v) => S.sel.add(v.id)); renderList(); renderSelbar(); renderInfo(); } }, MC.ico('check'), 'تحديد الظاهر (' + S.views.length + ')'),
      h('button', { class: 'btn', onclick: () => UI.openMoveDialog(Array.from(S.sel)) }, MC.ico('folder'), 'نقل إلى مجموعة'),
      h('button', { class: 'btn', title: showMode ? 'إظهار المحدد' : 'إخفاء المحدد', onclick: () => { const ids = Array.from(S.sel); S.sel.clear(); MC.setHidden(ids, !showMode); MC.toast((showMode ? 'أُعيد عرض ' : 'أُخفي ') + ids.length + ' عنصرًا', 'ok'); } }, MC.ico(showMode ? 'show' : 'hide'), showMode ? 'إظهار' : 'إخفاء'),
      h('button', { class: 'btn', title: 'طباعة المحدد', onclick: () => { need('Print', 'open') && MC.Print.open(UI.scopeRows(), { title: UI.scopeTitle() }); } }, MC.ico('print')),
      h('button', { class: 'btn', title: 'اختبار على المحدد', onclick: () => { need('Quiz', 'open') && MC.Quiz.open(UI.scopeRows(), { title: UI.scopeTitle() }); } }, MC.ico('quiz')),
      h('button', { class: 'btn dng', onclick: deleteSelected }, MC.ico('del'), 'حذف'),
      h('button', { class: 'btn', onclick: () => { S.sel.clear(); renderList(); renderSelbar(); renderInfo(); } }, MC.ico('x'), 'إلغاء'));
  }

  function render() { compute(); renderChips(); renderFilters(); renderInfo(); renderList(); renderSelbar(); }
  UI.render = render;

  /* ---------- boot ---------- */
  UI.init = () => {
    MC.load(); MC.applyFontVars();
    S.group = MC.settings.group || 'all'; if (S.group !== 'all' && !MC.getGroup(S.group)) S.group = 'all';
    buildShell(); renderBanner(); render();
    MC.on('data', () => { const ids = new Set(MC.data.items.map((i) => i.id)); S.sel.forEach((id) => { if (!ids.has(id)) S.sel.delete(id); }); renderBanner(); render(); });
    MC.on('settings', (p) => { if (/^(hidden|view|grouped|showSort)/.test(p)) render(); });
    MC.on('scores', () => { renderList(); });
    MC.on('hidden', () => { render(); });
    MC.on('source', () => { renderSrc(); renderBanner(); });
    if (MC.Source) MC.Source.init();
    MC.on('storage-error', () => MC.toast('تعذّر حفظ التعديلات في المتصفح (المساحة ممتلئة؟). صدّر الملف الآن للاحتفاظ بها.', 'err'));
    g.addEventListener('keydown', (e) => { if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName) && !MC.modal.top()) { e.preventDefault(); el.search.focus(); } });
    g.addEventListener('beforeunload', () => { try { MC.persistNow(); } catch (e) { /* ignore */ } });
  };
})(window);

</script>
<script>
try { MC.UI.init(); } catch (e) { console.error(e); document.getElementById('app').innerHTML = '<pre style="padding:20px;direction:ltr;white-space:pre-wrap;color:#b3261e">' + String(e && e.stack || e).replace(/</g, '&lt;') + '</pre>'; }
</script>
</body>
</html>
