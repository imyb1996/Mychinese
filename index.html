      el.dest.textContent = '';
      el.dest.appendChild(h('div', { class: 'row bk-dest' }, fld('القسم', gSel), fld('المجموعة الرئيسية', c1Sel), fld('المجموعة الفرعية', c2Sel)));

      if (S.c1 === NEW) {
        const num1 = h('span', { class: 'bk-num' }); const upd1 = () => { const q = seq1(); num1.textContent = pad(q.n) + '_'; num1.title = q.exists ? 'موجودة بهذا الاسم: ستُضاف العناصر إليها' : 'رقم التسلسل الجديد'; };
        const nm = h('input', { class: 'inp', type: 'text', placeholder: 'اسم المجموعة الرئيسية', oninput: () => { S.n1.name = nm.value; upd1(); } }); nm.value = S.n1.name; upd1();
        const lv = mkSel([{ v: 1, t: 'المستوى 1' }, { v: 2, t: 'المستوى 2' }, { v: 3, t: 'المستوى 3' }], S.n1.level, (v) => { S.n1.level = +v; });
        const lk = h('input', { class: 'inp', type: 'text', dir: 'ltr', placeholder: 'رابط (اختياري)', oninput: () => { S.n1.link = lk.value; } }); lk.value = S.n1.link;
        el.dest.appendChild(h('div', { class: 'bk-new' }, h('div', { class: 'bk-new-t', text: '➕ مجموعة رئيسية جديدة (يُنشأ عند الحفظ فقط)' }), h('div', { class: 'row' }, fld('الرقم والاسم', h('div', { class: 'bk-numrow' }, num1, nm)), fld('المستوى', lv), fld('الرابط', lk))));
      }
      if (S.c2 === NEW) {
        const num2 = h('span', { class: 'bk-num' }); const upd2 = () => { const q = seq2(); num2.textContent = pad(q.n) + '_'; num2.title = q.exists ? 'موجودة بهذا الاسم: ستُضاف العناصر إليها' : 'رقم التسلسل الجديد'; };
        const nm2 = h('input', { class: 'inp', type: 'text', placeholder: 'اسم المجموعة الفرعية', oninput: () => { S.n2 = nm2.value; upd2(); } }); nm2.value = S.n2; upd2();
        el.dest.appendChild(h('div', { class: 'bk-new' }, h('div', { class: 'bk-new-t', text: '➕ مجموعة فرعية جديدة (يُنشأ عند الحفظ فقط)' }), fld('الرقم والاسم', h('div', { class: 'bk-numrow' }, num2, nm2))));
      }

        el.dest.appendChild(h('div', { class: 'hint bk-info', text: 'ستُضاف العناصر في آخر هذه المجموعة الفرعية (فيه الآن ' + MC.itemsOf(S.c2).length + ' عنصر).' }));
      }
    }

    /* ---------- mapping ---------- */
    const maxCols = (rows) => rows.reduce((m, r) => Math.max(m, r.cells.length), 0);
    function fitMapping(map, n) { const o = map.slice(0, n); while (o.length < n) o.push('skip'); return o; }
    function renderMap() {
      const box = el.map; box.textContent = '';
      const total = maxCols(S.rows); const ncol = Math.min(12, total);
      el.hdrChk.checked = S.hdr; el.hdrChk.disabled = !S.rows.length;
      if (!ncol) { box.appendChild(h('div', { class: 'hint', text: 'سيظهر تعيين الأعمدة بعد اللصق.' })); return; }
      const cols = h('div', { class: 'bk-cols' });
      for (let i = 0; i < ncol; i++) {
        const sel = mkSel(MAP_OPTS, S.mapping[i] || 'skip', (v) => { const base = S.mapMode === 'manual' ? S.manualMap : S.mapping; S.manualMap = base.slice(); while (S.manualMap.length <= i) S.manualMap.push('skip'); S.manualMap[i] = v; S.mapMode = 'manual'; S.mapping = fitMapping(S.manualMap, maxCols(S.rows)); rebuildItems(); updateMapNote(); }, 'bk-msel');

        const smp = S.dataRows.slice(0, 3).map((r) => h('div', { class: 'bk-smp', title: r.cells[i] || '', text: r.cells[i] || '—' }));
        cols.appendChild(h('div', { class: 'bk-col' }, h('div', { class: 'bk-colh', title: head, text: head }), sel, smp));
      }
      box.appendChild(cols);
      if (total > ncol) box.appendChild(h('div', { class: 'hint', text: 'تُعرض أول 12 عمودًا فقط؛ الباقي يُتجاهل.' }));
      updateMapNote();
    }
    function updateMapNote() {
      const has = (k) => S.mapping.indexOf(k) >= 0;
      let t = S.mapMode === 'auto' ? 'تم تخمين الأعمدة تلقائيًا — عدّلها إن لزم.' : 'التعيين يدوي.';
      if (S.rows.length && !has('zh')) t += ' ⚠ لم يُعيَّن عمود للصيني.';
      el.mapNote.textContent = t;
    }
    function applyPreset(map) { S.mapMode = 'manual'; S.manualMap = map.slice(); S.mapping = fitMapping(S.manualMap, maxCols(S.rows)); rebuildItems(); renderMap(); }

    /* ---------- parse -> items ---------- */
    const normCell = clean;
    function onText() {
      S.text = el.ta.value;
      if (!S.text.trim()) S.hdrManual = false;
      S.rows = parse(S.text, { delimiter: S.delim });
      if (!S.hdrManual) S.hdr = S.rows.length > 0 && looksLikeHeader(S.rows[0]);
      reparse();
    }
    function reparse() {
      S.dataRows = S.hdr ? S.rows.slice(1) : S.rows;
      const n = maxCols(S.rows);

      rebuildItems(); renderMap();
    }
    function rebuildItems() {
      S.items = buildItems(S.dataRows, S.mapping).map((x) => Object.assign(x, { inc: true }));
      renderTable();
    }

    /* ---------- preview table ---------- */
    function statusHtml(a) {
      if (!a) return '';
      if (a.missing) return '<span class="tag warn">⚠ ينقصه الصيني</span>';
      const p = [];
      if (a.dupDb) {
        p.push('<span class="tag bad">🔁 موجود في القاموس</span>');
        a.existing.slice(0, 2).forEach((e) => p.push('<div class="bk-where">' + esc(e.groupLabel) + ' / ' + esc(e.c1name) + ' / ' + esc(e.c2name) + (e.sameC2 ? ' (نفس المجموعة الفرعية)' : '') + '</div>'));
        const more = a.existing.length - 2 + a.more;
        if (more > 0) p.push('<div class="bk-where">+' + more + ' أخرى</div>');
      }
      if (a.dupPaste) p.push('<span class="tag warn">🔁 مكرر داخل اللصق (صف ' + (a.firstIdx + 1) + ')</span>');
      if (!a.dupDb && !a.dupPaste) p.push('<span class="tag ok">✔ جاهز</span>');
      return p.join('');
    }
    function rowHtml(x, i) {
      return '<tr data-i="' + i + '"' + (x.inc ? '' : ' class="bk-off"') + '><td class="bk-c-chk"><input type="checkbox" data-act="inc"' + (x.inc ? ' checked' : '') + '></td>'
        + '<td class="bk-c-n">' + (i + 1) + '</td><td class="bk-c-st">' + statusHtml(S.an[i]) + '</td>'
        + COLS.map((c) => '<td class="bk-c bk-' + c.k + '" data-k="' + c.k + '">' + esc(x[c.k]) + '</td>').join('') + '</tr>';
    }
    function renderTable() {
      S.an = analyze(S.items, curC2());
      el.tbody.innerHTML = S.items.map(rowHtml).join('');
      el.empty.hidden = S.items.length > 0; el.wrap.hidden = !S.items.length;
      el.allChk.checked = S.items.every((x) => x.inc);
      updateStats();
    }
    // after an edit or destination change: re-analyse and refresh only the status cells
    function recompute() {
      S.an = analyze(S.items, curC2());
      const tds = el.tbody.querySelectorAll('.bk-c-st');
      for (let i = 0; i < tds.length && i < S.an.length; i++) tds[i].innerHTML = statusHtml(S.an[i]);
      updateStats();
    }
    function updateStats() {
      const n = S.items.length; const inc = S.items.filter((x) => x.inc).length;
      const dup = S.an.filter((a) => a.dupDb || a.dupPaste).length; const miss = S.an.filter((a) => a.missing).length;
      el.stats.innerHTML = '<span class="tag">لُصق: <b>' + n + '</b></span><span class="tag ok">سيُحفظ: <b>' + inc + '</b></span>'
        + '<span class="tag ' + (dup ? 'bad' : '') + '">مكرر: <b>' + dup + '</b></span><span class="tag ' + (miss ? 'warn' : '') + '">ناقص الصيني: <b>' + miss + '</b></span>';
      el.saveBtn.textContent = '💾 حفظ' + (inc ? ' (' + inc + ')' : '');
      el.saveBtn.disabled = S.busy || !inc;
      el.undoBtn.hidden = !S.last; el.undoBtn.disabled = S.busy;

    }
    function setAllInc(fn) {

      el.allChk.checked = S.items.every((x) => x.inc); updateStats();

    // inline editing: double click (tap on touch devices) a cell
    function startEdit(td) {

      const tr = td.parentNode; const i = +tr.dataset.i; const k = td.dataset.k; const item = S.items[i]; if (!item) return;
      const inp = h('input', { class: 'inp bk-ed ' + k, type: 'text', dir: k === 'ar' ? 'rtl' : 'ltr' }); inp.value = item[k];
      td.textContent = ''; td.appendChild(inp); inp.focus(); inp.select();

    /* ---------- auto fill (translation + pinyin) ---------- */
    const needsFill = (x) => (!x.ar || !x.en || !x.zh || !x.pin) && (x.ar || x.en || x.zh);
    function showProgress(done, total) {
      el.prog.hidden = false;
      el.progBar.style.width = (total ? Math.round(done * 100 / total) : 0) + '%';
      el.progTxt.textContent = 'جارٍ الترجمة… ' + done + ' / ' + total;
    }
    function setBusy(b) {

    }
    // -> 'ok' | 'anyway' | 'stop'
    async function runFill(inc) {
      const targets = inc.filter(needsFill);
      if (!targets.length) return 'ok';
      if (!MC.Translate || !MC.Translate.fillMany) {
        return (await MC.confirm('خدمة الترجمة غير متاحة. هل تريد الحفظ بدون ملء الحقول الناقصة؟', { okLabel: 'حفظ بدون ملء', cancelLabel: 'رجوع' })) ? 'anyway' : 'stop';

    /* ---------- save / undo ---------- */

    async function save() {

        const ok = await MC.confirm('بين الصفوف المحددة ' + warn.join(' و') + '.\nهل تريد الحفظ على أي حال؟', { okLabel: 'حفظ', cancelLabel: 'رجوع' });

    if (S.c2 && !c2s.some((o) => String(o.v) === String(S.c2))) S.c2 = '';
    fillSelect(el.c2, c2s, S.c2, S.c1 ? 'كل المجموعات الفرعية' : '— اختر المجموعة الرئيسية أولًا —'); el.c2.disabled = !S.c1;
    el.dup.classList.toggle('on', S.dupOnly);
    el.hid.innerHTML = MC.icon(S.hiddenMode === 'only' ? 'show' : 'hide') + (S.hiddenMode === 'only' ? ' عرض العادية' : ' المخفية') + ' <span class="n">' + MC.hiddenCount() + '</span>';
    el.hid.classList.toggle('on', S.hiddenMode === 'only'); el.hid.hidden = !MC.hiddenCount() && S.hiddenMode !== 'only';
    MC.$$('button', el.langs).forEach((b) => { const hid = MC.settings.hidden[b.dataset.lang]; b.classList.toggle('on', !hid); b.classList.toggle('off', !!hid); });
    MC.$$('button', el.view).forEach((b) => b.classList.toggle('on', b.dataset.v === MC.settings.view));
    el.grp.classList.toggle('on', !!MC.settings.grouped);
  }
  function renderInfo() {
    const dups = S.views.reduce((n, v) => n + (MC.dupIds(v.id) ? 1 : 0), 0);
    el.info.innerHTML = '<span><b>' + S.views.length + '</b> عنصر' + (S.hiddenMode === 'only' ? ' مخفي' : '') + '</span>' + (dups ? '<span>' + MC.icon('repeat') + ' ' + dups + ' مكرر</span>' : '') + (S.sel.size ? '<span>' + MC.icon('check') + ' محدد: <b>' + S.sel.size + '</b></span>' : '') + (MC.meta.working ? '<span title="نسخة معدّلة محفوظة في هذا المتصفح">' + MC.icon('data') + ' نسخة معدّلة</span>' : '');
    renderSrc(); el.info.appendChild(el.src); // counts + sync status: one block that sits in the view-buttons row (no separate line)
  }
  // Google Sheets sync status chip
  UI.srcText = () => {
    const st = MC.Source ? MC.Source.state : null; const cfg = MC.Source ? MC.Source.config() : null;
    if (!st || !cfg || !cfg.enabled) return { t: '☁ غير مربوط بالشيت', cls: '', title: 'اضغط لربط التطبيق بـ Google Sheets' };
    const when = st.lastSync ? ' · آخر مزامنة ' + new Date(st.lastSync).toLocaleTimeString('ar') : '';
    switch (st.status) {
      case 'loading': return { t: '☁ جارٍ التحميل من الشيت…', cls: '', title: '' };
      case 'syncing': return { t: '☁ جارٍ الإرسال إلى الشيت…', cls: '', title: '' };
      case 'synced': return { t: '☁ متزامن مع الشيت', cls: 'ok', title: (st.via || '') + when };
      case 'dirty': return { t: '☁ ' + st.pending + ' تعديل ' + (MC.Source.hasScript() ? 'بانتظار الإرسال' : 'محلي (الشيت للقراءة فقط)'), cls: 'warn', title: 'اضغط للتفاصيل' };
      case 'conflict': return { t: '⚠ تعارض مع الشيت', cls: 'bad', title: st.message };
      case 'offline': return { t: '⚠ لا اتصال بالشيت — نسخة محلية', cls: 'bad', title: st.message };
      case 'error': return { t: '⚠ خطأ في الشيت', cls: 'bad', title: st.message };
      case 'locked': return { t: '⚠ الجهاز غير مسجّل — اضغط للتفاصيل', cls: 'bad', title: st.message };
      case 'empty': return { t: '☁ الشيت فارغ — اضغط للتهيئة', cls: 'warn', title: st.message };
      default: return { t: '☁ الشيت: ' + (MC.Source.hasScript() ? 'Apps Script' : 'قراءة فقط'), cls: '', title: '' };
    }
  };
  function renderSrc() { const s = UI.srcText(); el.src.innerHTML = MC.icon(/^⚠/.test(s.t) ? 'warn' : 'cloud') + ' ' + esc(s.t.replace(/^[☁⚠]\s*/, '')); el.src.title = s.title || ''; el.src.className = 'chip tag-' + (s.cls || 'n'); el.src.style.borderColor = s.cls === 'ok' ? 'var(--gn)' : s.cls === 'warn' ? '#f1d98b' : s.cls === 'bad' ? 'var(--acc)' : ''; }
  function renderBanner() {
    el.banner.innerHTML = '';
    const st = MC.Source ? MC.Source.state : null;
    if (st && st.status === 'conflict') {
      const held = MC.Source.heldRemote(); const bar = h('div', { class: 'ui-banner' }, '⚠ ' + (st.message || 'تعارض مع الشيت'));
      if (held) {
        bar.append(
          h('button', { class: 'btn sm', onclick: async () => { if (await MC.confirm('استخدام بيانات الشيت وتجاهل تعديلاتك المحلية غير المرسلة؟', { danger: true, okLabel: 'استخدام الشيت' })) { MC.Source.useRemote(); S.sel.clear(); } } }, 'استخدام بيانات الشيت'),
          MC.Source.hasScript() ? h('button', { class: 'btn sm', onclick: async () => { const r = await MC.Source.push(); if (r.ok) { await MC.Source.refresh(); MC.toast('أُرسلت التعديلات', 'ok'); } else if (r.conflict) MC.toast('الشيت تغيّر أيضًا؛ اختر استخدام الشيت أو أبقِ نسختك', 'err'); } }, 'إرسال تعديلاتي أولًا') : null,
          h('button', { class: 'btn sm', onclick: () => MC.Source.keepLocal() }, 'إبقاء تعديلاتي محليًا'));
      } else {
        bar.append(
          h('button', { class: 'btn sm', onclick: async () => { if (await MC.confirm('تحديث من الشيت سيستبدل تعديلاتك غير المرسلة. متابعة؟', { danger: true, okLabel: 'تحديث' })) MC.Source.refresh({ force: true }); } }, 'تحديث من الشيت'),
          h('button', { class: 'btn sm', onclick: () => MC.Source.keepLocal() }, 'إبقاء تعديلاتي محليًا'));
      }
      el.banner.appendChild(bar); return;
    }
    const ack = MC.store.get('mc.baseAck', '');
    if (MC.meta.baseChanged && ack !== MC.meta.hash) {
      el.banner.appendChild(h('div', { class: 'ui-banner' }, '⚠ تغيّرت البيانات المضمّنة في التطبيق (ملف جديد)، لكن لديك نسخة معدّلة محفوظة في المتصفح.',
        h('button', { class: 'btn sm', onclick: async () => { if (await MC.confirm('استبدال نسختك المعدّلة بالبيانات الجديدة المضمّنة؟\nستُفقد تعديلاتك غير المصدّرة.', { danger: true })) { MC.resetToEmbedded(); S.sel.clear(); } } }, 'استخدام الجديدة'),
        h('button', { class: 'btn sm', onclick: () => { MC.store.set('mc.baseAck', MC.meta.hash); renderBanner(); } }, 'إبقاء نسختي')));
    }
  }

  const colTemplate = () => MC.visibleLangs().map((k) => ({ zh: '1.1fr', pin: '1fr', ar: '1.2fr', en: '1.2fr' }[k])).join(' ');
  const ab = (icon, title, act) => '<button data-act="' + (act || icon) + '" title="' + title + '" aria-label="' + title + '">' + MC.icon(icon) + '</button>';
  function actsHTML(v, reorder) {
    const hid = MC.isHidden(v.id);
    return '<div class="ui-acts">' + (MC.canSpeak() ? ab('speak', 'نطق') : '') + ab('edit', 'تعديل') + ab('dup', 'تكرار (نسخ إلى إضافة جديدة)') +
      (reorder ? ab('up', 'تحريك لأعلى') + ab('down', 'تحريك لأسفل') : '') + (hid ? ab('show', 'إظهار الكلمة (إلغاء الإخفاء)', 'hide') : ab('hide', 'إخفاء الكلمة')) + ab('del', 'حذف') + '</div>';
  }
  function tagsHTML(v) {
    let t = ''; const dup = MC.dupIds(v.id);
    if (dup) t += '<span class="tag warn" title="يوجد ' + dup.length + ' عناصر بنفس النص الصيني">' + MC.icon('repeat') + ' ×' + dup.length + '</span>';
    const sc = MC.Scores && MC.Scores.info ? MC.Scores.info(v.id) : null;
    if (sc) t += '<span class="ui-sc ' + scoreClass(sc.s) + '" title="درجة الحفظ (' + sc.n + ' محاولة)">' + (sc.s > 0 ? '+' : '') + sc.s + '</span>';
    return t;
  }
  function itemHTML(v, reorder, cards) {
    const sel = S.sel.has(v.id); const cells = MC.visibleLangs().map((k) => '<div class="t-' + k + '"' + (k === 'zh' ? ' lang="zh-CN"' : '') + '>' + esc(v[k]) + '</div>').join('');
    const chk = '<label class="ui-sel"><input type="checkbox" data-act="sel"' + (sel ? ' checked' : '') + ' aria-label="تحديد"></label>';
    const no = MC.settings.showSort ? '<span class="ui-no">' + Math.round(v.sort) + '</span>' : '';
    const open = S.openId === v.id ? ' open' : '';
    if (cards) return '<div class="ui-cd' + (sel ? ' sel' : '') + open + '" data-id="' + v.id + '" style="' + groupColors(v.group) + '"><div class="ui-cd-top">' + chk + no + '<span class="ui-sp"></span>' + tagsHTML(v) + '</div>' + cells + actsHTML(v, reorder) + '</div>';
    return '<div class="ui-it' + (sel ? ' sel' : '') + open + '" data-id="' + v.id + '" style="' + groupColors(v.group) + '">' + chk + no + '<div class="ui-cells">' + cells + '</div><div class="ui-meta">' + tagsHTML(v) + '</div>' + actsHTML(v, reorder) + '</div>';
  }
  function buildBlocks() {
    const out = []; const grouped = MC.settings.grouped; let c1 = null; let c2 = null; const n1 = new Map(); const n2 = new Map();
    grpIds = { c1: new Map(), c2: new Map() };
    S.views.forEach((v) => {
      n1.set(v.c1, (n1.get(v.c1) || 0) + 1); n2.set(v.c2, (n2.get(v.c2) || 0) + 1);
      if (!grpIds.c1.has(v.c1)) grpIds.c1.set(v.c1, []); grpIds.c1.get(v.c1).push(v.id);
      if (!grpIds.c2.has(v.c2)) grpIds.c2.set(v.c2, []); grpIds.c2.get(v.c2).push(v.id);
    });
    const reorder = grouped && !S.q && !S.dupOnly;
    S.views.forEach((v) => {
      if (grouped) {
        if (v.c1 !== c1) { c1 = v.c1; c2 = null; out.push({ h: '<div class="ui-h1" style="' + groupColors(v.group) + '">' + hsel('c1', v.c1, 'تحديد كل ما هو معروض في هذه المجموعة الرئيسية') + '<span>' + esc(v.groupLabel) + '</span><span class="sep">›</span><b>' + esc(v.c1name) + '</b>' + (v.level ? '<span class="tag">مستوى ' + v.level + '</span>' : '') + (v.link ? '<a href="' + esc(v.link) + '" target="_blank" rel="noopener">' + MC.icon('link') + ' فتح الرابط</a>' : '') + '<span class="n">' + n1.get(v.c1) + '</span></div>' }); }
        if (v.c2 !== c2) { c2 = v.c2; out.push({ h: '<div class="ui-h2" style="' + groupColors(v.group) + '">' + hsel('c2', v.c2, 'تحديد كل ما هو معروض في هذه المجموعة الفرعية') + esc(v.c2name) + ' <span class="n">' + n2.get(v.c2) + '</span><button class="btn sm" data-act="addc2" data-c2="' + v.c2 + '" title="إضافة عنصر في هذه المجموعة الفرعية">' + MC.icon('add') + ' إضافة هنا</button></div>' }); }
      }
      out.push({ h: itemHTML(v, reorder, MC.settings.view === 'cards') });
    });
    return out;
  }
  // checkbox placed in a group header bar; ids of the items currently displayed per main group (c1) / sub-group (c2)
  const hsel = (kind, key, title) => '<label class="ui-hsel" title="' + title + '"><input type="checkbox" data-act="selgrp" data-kind="' + kind + '" data-key="' + key + '" aria-label="' + title + '"></label>';
  let grpIds = { c1: new Map(), c2: new Map() };
  // tick / half-tick / untick every header checkbox according to the current selection
  function syncHeaderChecks() {
    MC.$$('input[data-act="selgrp"]', el.list).forEach((c) => {
      const ids = (grpIds[c.dataset.kind] || new Map()).get(+c.dataset.key) || []; let n = 0; ids.forEach((id) => { if (S.sel.has(id)) n++; });
      c.checked = n > 0 && n === ids.length; c.indeterminate = n > 0 && n < ids.length;
    });
  }
  let blocks = []; let shown = 0;
  function renderList() {
    blocks = buildBlocks(); shown = 0;
    el.list.className = 'ui-list' + (MC.settings.view === 'cards' ? ' cards' : '');
    el.list.style.setProperty('--cols', colTemplate());
    el.list.innerHTML = '';
    if (!blocks.length) {
      const none = !MC.data.items.length; const st = MC.Source ? MC.Source.state.status : '';
      el.list.innerHTML = '<div class="ui-empty"><div class="big">' + MC.icon(none ? 'cloud' : 'search') + '</div><div>' + (none ? (st === 'loading' || st === 'idle' ? 'جارٍ تحميل البيانات من الشيت…' : 'لا توجد بيانات بعد. تحقق من الاتصال بالشيت (اضغط شريحة الحالة).') : 'لا توجد نتائج' + (S.q ? ' لـ «' + esc(S.q) + '»' : '')) + '</div></div>'; el.more.innerHTML = ''; return;
    }
    appendBlocks(S.limit);
  }
  function appendBlocks(upTo) {
    const end = Math.min(blocks.length, upTo); let html = '';
    for (let i = shown; i < end; i++) html += blocks[i].h;
    el.list.insertAdjacentHTML('beforeend', html); shown = end; syncHeaderChecks();
    el.more.innerHTML = shown < blocks.length ? '<button class="btn" type="button">عرض المزيد (' + (blocks.length - shown) + ')</button>' : '';
    const b = MC.$('button', el.more); if (b) b.onclick = loadMore;
  }
  function loadMore() { if (shown >= blocks.length) return; S.limit = shown + STEP; appendBlocks(S.limit); }

  function renderSelbar() {
    const n = S.sel.size; el.selbar.hidden = !n; if (!n) return;
    el.selbar.innerHTML = '';
    const showMode = S.hiddenMode === 'only';
    el.selbar.append(h('b', { text: 'محدد: ' + n }),
      h('button', { class: 'btn', onclick: () => { S.views.forEach((v) => S.sel.add(v.id)); renderList(); renderSelbar(); renderInfo(); } }, MC.ico('check'), 'تحديد الظاهر (' + S.views.length + ')'),
      h('button', { class: 'btn', onclick: () => UI.openMoveDialog(Array.from(S.sel)) }, MC.ico('folder'), 'نقل إلى مجموعة'),
      h('button', { class: 'btn', title: showMode ? 'إظهار المحدد' : 'إخفاء المحدد', onclick: () => { const ids = Array.from(S.sel); S.sel.clear(); MC.setHidden(ids, !showMode); MC.toast((showMode ? 'أُعيد عرض ' : 'أُخفي ') + ids.length + ' عنصرًا', 'ok'); } }, MC.ico(showMode ? 'show' : 'hide'), showMode ? 'إظهار' : 'إخفاء'),
      h('button', { class: 'btn', title: 'طباعة المحدد', onclick: () => { need('Print', 'open') && MC.Print.open(UI.scopeRows(), { title: UI.scopeTitle() }); } }, MC.ico('print')),
      h('button', { class: 'btn', title: 'اختبار على المحدد', onclick: () => { need('Quiz', 'open') && MC.Quiz.open(UI.scopeRows(), { title: UI.scopeTitle() }); } }, MC.ico('quiz')),
      h('button', { class: 'btn dng', onclick: deleteSelected }, MC.ico('del'), 'حذف'),
      h('button', { class: 'btn', onclick: () => { S.sel.clear(); renderList(); renderSelbar(); renderInfo(); } }, MC.ico('x'), 'إلغاء'));
  }

  function render() { compute(); renderChips(); renderFilters(); renderInfo(); renderList(); renderSelbar(); }
  UI.render = render;

  /* ---------- boot ---------- */
  // Entry point. Secure build: nothing from the dictionary is loaded or shown until this browser's device code is approved in the sheet.
  UI.init = () => {
    MC.applyFontVars();
    if (MC.Source && MC.Source.secure()) UI.gate().then(() => UI.start()); else UI.start();
  };
  UI.start = () => {
    MC.load(); MC.applyFontVars();
    S.group = MC.settings.group || 'all'; if (S.group !== 'all' && !MC.getGroup(S.group)) S.group = 'all';
    buildShell(); renderBanner(); render();
    MC.on('data', () => { const ids = new Set(MC.data.items.map((i) => i.id)); S.sel.forEach((id) => { if (!ids.has(id)) S.sel.delete(id); }); renderBanner(); render(); });
    MC.on('settings', (p) => { if (/^(hidden|view|grouped|showSort)/.test(p)) render(); });
    MC.on('scores', () => { renderList(); });
    MC.on('hidden', () => { render(); });
    MC.on('source', () => {
      renderSrc(); renderBanner();
      // access revoked while the app is open (secure build): go back to the lock screen
      if (MC.Source.secure() && MC.Source.state.status === 'locked') g.location.reload();
    });
    if (MC.Source) MC.Source.init();
    MC.on('storage-error', () => MC.toast('تعذّر حفظ التعديلات في المتصفح (المساحة ممتلئة؟). صدّر الملف الآن للاحتفاظ بها.', 'err'));
    g.addEventListener('keydown', (e) => { if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName) && !MC.modal.top()) { e.preventDefault(); el.search.focus(); } });
    g.addEventListener('beforeunload', () => { try { MC.persistNow(); } catch (e) { /* ignore */ } });
  };
})(window);

</script>
<script>
try { MC.UI.init(); } catch (e) { console.error(e); document.getElementById('app').innerHTML = '<pre style="padding:20px;direction:ltr;white-space:pre-wrap;color:#b3261e">' + String(e && e.stack || e).replace(/</g, '&lt;') + '</pre>'; }
</script>
</body>
